name: Publish APT Repository

# Runs when a release is published (every `gh release create` / GitHub UI
# publish). Can also be triggered manually via `gh workflow run publish-apt`
# to re-sync the apt repo with the current state of GitHub Releases.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2.22.2-r10). Leave blank to republish current state."
        required: false
        default: ""

# Pushing to gh-pages needs write permission on the default token.
permissions:
  contents: write

# Serialize all runs across the gh-pages workspace to eliminate the
# push-rejected race that fired on rapid back-to-back releases (r3→r4
# delete-and-republish dance, May 2026). The publish step force-pushes a
# single orphan commit, so `concurrency` is what guarantees two runs
# never force-push over each other. Subsequent triggers queue instead of
# running in parallel.
concurrency:
  group: publish-apt-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main (for packaging/apt-repo config)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install reprepro + dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
              echo "::error::APT_SIGNING_KEY secret is empty — configure it in repo settings"
              exit 1
          fi

          # Write to file so gpg can parse reliably. echo | gpg had issues
          # with some secret contents — write-then-import is robust.
          KEYFILE=$(mktemp)
          printf '%s\n' "$APT_SIGNING_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"

          # Diagnostic: size + first/last line (safe to show — headers only)
          echo "Key file size: $(wc -c < "$KEYFILE") bytes"
          echo "First line: $(head -n 1 "$KEYFILE")"
          echo "Last line:  $(tail -n 1 "$KEYFILE")"
          if ! head -n 1 "$KEYFILE" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
              echo "::error::APT_SIGNING_KEY does not start with '-----BEGIN PGP PRIVATE KEY BLOCK-----' — secret is malformed or truncated"
              exit 1
          fi
          if ! tail -n 1 "$KEYFILE" | grep -q "END PGP PRIVATE KEY BLOCK"; then
              echo "::error::APT_SIGNING_KEY does not end with '-----END PGP PRIVATE KEY BLOCK-----' — secret is truncated"
              exit 1
          fi

          echo "--- importing ---"
          gpg --batch --yes --import "$KEYFILE" 2>&1 | head -20
          rm -f "$KEYFILE"

          echo "--- secret keys now in keyring ---"
          gpg --list-secret-keys --keyid-format=long
          # Confirm the key ID we expect is actually present.
          if ! gpg --list-secret-keys "$APT_SIGNING_KEY_ID" > /dev/null 2>&1; then
              echo "::error::Key $APT_SIGNING_KEY_ID not found after import"
              exit 1
          fi

      - name: Configure non-interactive GPG for reprepro
        run: |
          # reprepro calls gpg internally; we want zero prompting for a
          # passphrase or trust agent dialog on a headless runner.
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          {
            echo "pinentry-mode loopback"
            echo "use-agent"
          } >> ~/.gnupg/gpg.conf
          {
            echo "allow-loopback-pinentry"
            echo "default-cache-ttl 21600"
            echo "max-cache-ttl 21600"
          } >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          # Mark our key as ultimately trusted so reprepro doesn't choke
          # on "no trust path" warnings. import-ownertrust needs the full
          # 40-char fingerprint, not the short key id — look it up from
          # what we just imported.
          FPR=$(gpg --list-secret-keys --with-colons "${{ secrets.APT_SIGNING_KEY_ID }}" \
                | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$FPR" ]; then
              echo "::error::could not resolve fingerprint for key id ${{ secrets.APT_SIGNING_KEY_ID }}"
              exit 1
          fi
          echo "Trust fingerprint: $FPR"
          echo "${FPR}:6:" | gpg --import-ownertrust

      - name: Checkout or create gh-pages worktree
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
              echo "gh-pages branch exists — fetching"
              git fetch origin gh-pages
              git worktree add gh-pages-dir gh-pages
          else
              echo "gh-pages branch missing — creating orphan"
              git worktree add --detach gh-pages-dir
              cd gh-pages-dir
              git checkout --orphan gh-pages
              git rm -rf . || true
              touch .nojekyll   # disable Jekyll so files starting with _ are served
              echo "# VPNRouter APT Repository" > index.md
              cd ..
          fi

      - name: Lay out apt repo skeleton
        run: |
          # v2: wipe reprepro state on every run. Why? Earlier runs that
          # failed AFTER writing to db/ (e.g. a passphrase issue that
          # blocked signing but not the db write) left the repository in
          # a state where reprepro thinks packages are included but pool/
          # and dists/ are empty. The db entry then makes subsequent
          # includedeb calls no-op ("already present"). Wiping db/pool/
          # dists and re-including from scratch is safe because the
          # source of truth is the .deb artifacts on GitHub Releases
          # anyway.
          rm -rf gh-pages-dir/apt/db gh-pages-dir/apt/pool gh-pages-dir/apt/dists

          mkdir -p gh-pages-dir/apt/conf
          cp packaging/apt-repo/distributions gh-pages-dir/apt/conf/distributions
          # Serve the public key in BOTH formats:
          #  - key.gpg  : binary (dearmored) — what apt wants when users do
          #               `curl ... | sudo tee /etc/apt/keyrings/vpnrouter.gpg`.
          #               Previous version shipped armored here and apt
          #               complained `NO_PUBKEY ...` during `apt update`.
          #  - vpnrouter.asc : ASCII-armored — human-readable, useful for
          #                    inspection with `gpg --show-keys`.
          gpg --dearmor \
              < packaging/apt-repo/vpnrouter-apt-public.asc \
              > gh-pages-dir/apt/key.gpg
          cp packaging/apt-repo/vpnrouter-apt-public.asc gh-pages-dir/apt/vpnrouter.asc
          # Simple landing page for the apt URL
          cat > gh-pages-dir/apt/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>VPNRouter APT Repository</title>
          <style>body{font:14px/1.5 system-ui,sans-serif;max-width:720px;margin:3em auto;padding:0 1em;color:#222}code,pre{background:#f4f4f4;padding:2px 6px;border-radius:3px;font-size:13px}pre{padding:12px;overflow:auto}h1{font-size:1.6em}</style>
          <h1>VPNRouter APT Repository</h1>
          <p>Add this repository to Debian/Ubuntu/Mint and install via <code>apt</code>:</p>
          <pre>curl -fsSL https://pavellizunov.github.io/VPNRouter/apt/key.gpg \
            | sudo tee /etc/apt/keyrings/vpnrouter.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/vpnrouter.gpg] https://pavellizunov.github.io/VPNRouter/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/vpnrouter.list
          sudo apt update
          sudo apt install vpnrouter</pre>
          <p>After that, <code>sudo apt upgrade</code> keeps VPNRouter up to date.</p>
          <p><a href="https://github.com/PavelLizunov/VPNRouter">&larr; GitHub</a></p>
          HTML

      - name: Download .deb artifacts from release(s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir -p .apt-debs

          # apt repo ships STABLE releases only. Prereleases (rolling
          # -rN candidates, any release with prerelease=true on GitHub)
          # are not suitable for `sudo apt upgrade` — they'd auto-update
          # every user to experimental builds. Users who want prereleases
          # download the .deb manually from GitHub Releases page.
          is_stable_tag() {
              local tag="$1"
              # Reject tags that parse as non-stable by naming: -r1 / -r2 /
              # -beta / -rc / -alpha etc. Plain "vX.Y.Z" only.
              case "$tag" in
                  *-r[0-9]*|*-rc*|*-beta*|*-alpha*|*-pre*) return 1 ;;
              esac
              # Also reject anything GitHub flagged as prerelease.
              gh release view "$tag" --repo "${{ github.repository }}" \
                  --json isPrerelease --jq '.isPrerelease' 2>/dev/null | grep -q false
          }

          if [ -n "$EVENT_TAG" ]; then
              TAG="$EVENT_TAG"
              echo "Triggered by release.published for tag: $TAG (prerelease=$EVENT_IS_PRERELEASE)"
              if [ "$EVENT_IS_PRERELEASE" = "true" ] || ! is_stable_tag "$TAG"; then
                  # v2.28.0: don't EXIT the whole workflow on prerelease —
                  # we still want install.sh + landing page to publish.
                  # v2.46.0-r6: release.published can arrive before
                  # `gh release edit --prerelease`, so the event payload may
                  # still say prerelease=false for rolling -rN tags. Treat the
                  # tag shape as authoritative too.
                  # Fix v2.28.0-r1+: also re-download ALL stable .debs and
                  # re-include them, because the earlier "Lay out apt repo
                  # skeleton" step wipes apt/db / pool / dists to guard
                  # against half-broken reprepro state. If we skip the
                  # download entirely, we'd end up publishing an EMPTY apt
                  # repo (users `apt update` would stop working). Falling
                  # through to the TAG="" branch re-downloads every stable
                  # .deb from the last 30 releases and rebuilds dists/pool
                  # from scratch — same effect as `workflow_dispatch` with
                  # no tag, which is our documented "re-sync apt repo"
                  # escape hatch.
                  echo "::notice::$TAG is a prerelease — install.sh + landing page will publish, apt repo will re-sync from existing stable releases (this prerelease's .deb is NOT added)"
                  TAG=""
              fi
          elif [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
              echo "workflow_dispatch with explicit tag: $TAG"
              if ! is_stable_tag "$TAG"; then
                  echo "::warning::$TAG looks like a prerelease but was requested explicitly — honouring the request anyway"
              fi
          else
              TAG=""
              echo "workflow_dispatch without tag — will re-index ALL STABLE releases from the last 30"
          fi

          if [ -n "$TAG" ]; then
              # v2.22.4: retry — release.published fires the moment the
              # release is created, but the Linux CI upload of the .deb
              # may still be in flight. Wait up to ~3 minutes for the
              # asset to show up before giving up.
              download_ok=0
              for attempt in 1 2 3 4 5 6; do
                  if gh release download "$TAG" \
                      --repo "${{ github.repository }}" \
                      --pattern "*-linux-amd64.deb" \
                      --dir .apt-debs \
                      --clobber 2>&1; then
                      download_ok=1
                      break
                  fi
                  echo "Attempt $attempt: .deb not available yet for $TAG, waiting 30s..."
                  sleep 30
              done
              if [ "$download_ok" = "0" ]; then
                  echo "::error::No linux-amd64.deb asset on release $TAG after 6 attempts (~3 min). Aborting."
                  exit 1
              fi
          else
              gh release list --repo "${{ github.repository }}" --limit 30 --json tagName --jq '.[] | .tagName' | while read -r t; do
                  if is_stable_tag "$t"; then
                      echo "-- downloading deb for stable release $t --"
                      gh release download "$t" \
                          --repo "${{ github.repository }}" \
                          --pattern "*-linux-amd64.deb" \
                          --dir .apt-debs \
                          --clobber 2>/dev/null || echo "  (no .deb asset for $t)"
                  else
                      echo "-- skipping $t (prerelease) --"
                  fi
              done
          fi

          echo "Collected debs:"
          ls -lh .apt-debs || true

      - name: Ensure gh-pages root metadata (CNAME, .nojekyll, index.md)
        run: |
          # Custom domain: vpn.ninitux.com. This CNAME file is what tells
          # GitHub Pages to serve gh-pages content at the custom hostname
          # and to issue + renew a Let's Encrypt cert for it. Must be
          # present at gh-pages root; regenerating here so it survives any
          # future full rewrite of gh-pages content (e.g. if we ever wipe
          # the branch to rebuild from scratch).
          #
          # A single FQDN, no newline — GitHub's parser is strict about
          # trailing whitespace.
          printf 'vpn.ninitux.com' > gh-pages-dir/CNAME

          # gh-pages is now published as a single ORPHAN commit on every
          # run (see the final "Publish gh-pages" step), so EVERY file the
          # site needs must be (re)materialised here — nothing survives
          # implicitly from a previous commit. These two were previously
          # written only when the branch was first created:
          #   .nojekyll — disables Jekyll so paths starting with "_" and
          #               the apt/ tree are served verbatim.
          #   index.md  — trivial root marker (index.html is the real page).
          touch gh-pages-dir/.nojekyll
          echo "# VPNRouter APT Repository" > gh-pages-dir/index.md

      - name: Publish install scripts (Linux + Windows) to gh-pages root
        run: |
          # v2.28.0: ship a user-friendly installer script at the gh-pages
          # root so people can do `curl -fsSL .../install.sh | sudo sh`
          # without typing any apt-source-list incantations.
          #
          # Also available at the pretty redirect URLs configured by the
          # user's own landing page (e.g. vpn.ninitux.com -> CNAME or
          # 302 -> this script). See packaging/apt-repo/install.sh for the
          # script content.
          sed 's/\r$//' packaging/apt-repo/install.sh > gh-pages-dir/install.sh
          chmod 755 gh-pages-dir/install.sh
          # Copy to /apt/ too so both URLs work: install.sh and apt/install.sh.
          cp gh-pages-dir/install.sh gh-pages-dir/apt/install.sh

          # v2.28.1: Windows install.ps1 + uninstall.ps1 for symmetric
          # one-liner UX across platforms:
          #   PowerShell:  iwr -useb https://vpn.ninitux.com/install.ps1 | iex
          # See packaging/windows/install.ps1 for the script content.
          # Both files must keep CRLF stripping (even though they're PS1
          # not sh) because .gitattributes auto-converts and we want
          # deterministic byte content on GitHub Pages.
          sed 's/\r$//' packaging/windows/install.ps1   > gh-pages-dir/install.ps1
          sed 's/\r$//' packaging/windows/uninstall.ps1 > gh-pages-dir/uninstall.ps1
          # diagnose.ps1 — read-only YouTube/connectivity layer-probe a user runs
          # while connected on a full-tunnel config:
          #   iwr -useb https://vpn.ninitux.com/diagnose.ps1 | iex
          sed 's/\r$//' packaging/windows/diagnose.ps1  > gh-pages-dir/diagnose.ps1

          # Android download / install page at /android. Client-side JS
          # resolves the latest VPNRouter-v*-android.apk from the GitHub API
          # (graceful fallback to the releases page if no APK is attached yet).
          mkdir -p gh-pages-dir/android
          cp packaging/android-page/index.html gh-pages-dir/android/index.html
          # v2.31.8-r8: repair.cmd is a self-contained recovery tool for
          # users with broken installs (mixed-version DLLs, app crashes
          # at launch, "did not take effect" loop). Browser-downloadable;
          # right-click → Run as administrator → ~60 s automated repair.
          # CRLF line endings preserved (cmd.exe is fine with either,
          # but a copy-via-browser may get LF normalised; explicit
          # restoration is defensive). Mode 755 so it's executable on
          # case the user runs it via WSL/Cygwin.
          sed 's/\r$//' packaging/windows/repair.cmd > /tmp/repair-lf.cmd
          # Re-add CRLF for genuine Windows execution semantics.
          sed 's/$/\r/' /tmp/repair-lf.cmd > gh-pages-dir/repair.cmd
          chmod 755 gh-pages-dir/repair.cmd
          chmod 644 gh-pages-dir/install.ps1 gh-pages-dir/uninstall.ps1 gh-pages-dir/diagnose.ps1
          # Simple landing page at gh-pages root linking to the installer +
          # apt repo. Prevents the 404 that Pages currently returns for `/`.
          cat > gh-pages-dir/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <meta charset="utf-8">
          <title>VPNRouter - Install</title>
          <style>
            body{font:14px/1.5 system-ui,-apple-system,sans-serif;max-width:720px;margin:3em auto;padding:0 1em;color:#222}
            code,pre{background:#f4f4f4;padding:2px 6px;border-radius:3px;font-size:13px;font-family:ui-monospace,SF Mono,monospace}
            pre{padding:12px;overflow:auto}
            h1{font-size:1.7em;margin-bottom:.2em}
            h2{font-size:1.1em;margin-top:1.8em;margin-bottom:.3em}
            .sub{color:#666;margin:0 0 1.8em}
            a{color:#0366d6;text-decoration:none}
            a:hover{text-decoration:underline}
            .plat{font-size:.9em;color:#888}
          </style>
          <h1>VPNRouter</h1>
          <p class="sub">Process-based split-tunnel VPN router. Routes selected apps through VLESS+Reality via sing-box TUN, everything else goes direct. <a href="https://github.com/PavelLizunov/VPNRouter">Source</a>.</p>

          <h2>Linux <span class="plat">(Debian / Ubuntu / Mint / Pop / elementary)</span></h2>
          <pre>curl -fsSL https://vpn.ninitux.com/install.sh | sudo sh</pre>
          <p>Adds the signed apt repository, installs <code>vpnrouter</code>, enables passwordless VPN via POSIX capabilities. Updates: <code>sudo apt upgrade</code>.</p>

          <h2>macOS <span class="plat">(Apple Silicon, via Homebrew Cask)</span></h2>
          <pre>brew install --cask pavellizunov/vpnrouter/vpnrouter</pre>
          <p>Installs to <code>/Applications/VPNRouter.app</code>. First launch prompts once for sudoers setup, then passwordless. Updates: <code>brew upgrade --cask vpnrouter</code>.</p>

          <h2>Windows <span class="plat">(10 / 11, x64)</span></h2>
          <p>Run in PowerShell (auto-elevates via UAC):</p>
          <pre>iwr -useb https://vpn.ninitux.com/install.ps1 | iex</pre>
          <p>Installs to <code>C:\Program Files\VPNRouter</code>, registers Start Menu + Add/Remove Programs. Updates: re-run the same command. Uninstall: Settings &rarr; Apps &rarr; VPNRouter, or <code>iwr -useb https://vpn.ninitux.com/uninstall.ps1 | iex</code>.</p>

          <h2>Manual download</h2>
          <p>All platforms, including tar.gz / AppImage for non-Debian Linux: <a href="https://github.com/PavelLizunov/VPNRouter/releases/latest">GitHub Releases</a>.</p>
          <p>Traditional apt setup (without one-liner): see <a href="apt/">/apt/</a>.</p>
          </html>
          HTML

      - name: Add .deb(s) to apt repo
        run: |
          if ! ls .apt-debs/*.deb > /dev/null 2>&1; then
              echo "::warning::No .deb files downloaded — skipping reprepro include step"
              exit 0
          fi

          cd gh-pages-dir/apt
          for deb in ../../.apt-debs/*.deb; do
              name=$(basename "$deb")
              echo "Including $name"
              # --ignore=extension in case filename has -r1 etc.; --component main
              # -S net sets section in the generated index
              reprepro -Vb . includedeb stable "$deb" || {
                  echo "::warning::reprepro failed on $name (maybe already present)"
              }
          done

          echo "Repository layout:"
          find . -maxdepth 4 -type f | sort | head -40

      - name: Publish gh-pages (single orphan commit, force-push)
        run: |
          cd gh-pages-dir
          # gh-pages is a FULLY GENERATED branch: the apt indices, pool,
          # install scripts and landing pages are all rebuilt from scratch
          # on every run, and the .deb source-of-truth lives on GitHub
          # Releases. It therefore needs NO git history.
          #
          # We publish it as a single ORPHAN commit and force-push. This:
          #   1. permanently prevents the branch from accumulating obsolete
          #      pool/*.deb blobs in history. Each stable version's .deb is
          #      a unique ~53 MB blob; on a long-lived branch they were
          #      never pruned, so gh-pages history had grown to ~13 GB /
          #      309 dead .deb blobs — effectively the entire repo's bloat.
          #   2. doubles as the one-time cleanup: the first run after this
          #      change collapses all that history into a single commit.
          # The `concurrency:` guard at the top serialises runs, so the
          # force-push can never race another publish.
          git checkout --orphan _publish
          git add -A
          if git diff --cached --quiet; then
              echo "::error::gh-pages working tree is empty — refusing to publish an empty site"
              exit 1
          fi
          MSG="Publish $( [ -n "${{ github.event.release.tag_name }}" ] && echo "${{ github.event.release.tag_name }}" || echo "apt repo sync" )"
          git commit -q -m "$MSG"
          git push --force origin HEAD:gh-pages
          echo "Published gh-pages as a single orphan commit: $MSG"

      - name: Print installation snippet
        run: |
          cat <<EOF
          ====================================================================
          Published to https://pavellizunov.github.io/VPNRouter/apt/
          ====================================================================

          To install VPNRouter on a Debian/Ubuntu/Mint machine:

          curl -fsSL https://pavellizunov.github.io/VPNRouter/apt/key.gpg \
              | sudo tee /etc/apt/keyrings/vpnrouter.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/vpnrouter.gpg] https://pavellizunov.github.io/VPNRouter/apt stable main" \
              | sudo tee /etc/apt/sources.list.d/vpnrouter.list
          # NB: key.gpg is served in binary (dearmored) form, so plain
          # `tee` into the keyring works — no `gpg --dearmor` step needed.
          sudo apt update && sudo apt install vpnrouter

          ====================================================================
          EOF
