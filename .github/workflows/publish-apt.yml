name: Publish APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Run provenance tag (must match --ref tag). Always reindexes stable, never includes a candidate."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-apt-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      INPUT_TAG: ${{ inputs.tag }}
      EVENT_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate run tag binding
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ] ||
             [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-r[1-9][0-9]*)?$ ]]; then
              echo "::error::APT publication requires a canonical release tag ref; dispatch with --ref <tag>"
              exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
              workflow_dispatch)
                  if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::Input tag must equal the workflow run tag"
                      exit 1
                  fi ;;
              release)
                  if [ "$EVENT_TAG" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::Release event tag must equal the workflow run tag"
                      exit 1
                  fi ;;
              *) exit 1 ;;
          esac

      - name: Checkout exact run SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify remote tag matches run SHA
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install reprepro + dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
              echo "::error::APT_SIGNING_KEY secret is empty — configure it in repo settings"
              exit 1
          fi

          KEYFILE=$(mktemp)
          printf '%s\n' "$APT_SIGNING_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"

          echo "Key file size: $(wc -c < "$KEYFILE") bytes"
          echo "First line: $(head -n 1 "$KEYFILE")"
          echo "Last line:  $(tail -n 1 "$KEYFILE")"
          if ! head -n 1 "$KEYFILE" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
              echo "::error::APT_SIGNING_KEY does not start with '-----BEGIN PGP PRIVATE KEY BLOCK-----' — secret is malformed or truncated"
              exit 1
          fi
          if ! tail -n 1 "$KEYFILE" | grep -q "END PGP PRIVATE KEY BLOCK"; then
              echo "::error::APT_SIGNING_KEY does not end with '-----END PGP PRIVATE KEY BLOCK-----' — secret is truncated"
              exit 1
          fi

          echo "--- importing ---"
          gpg --batch --yes --import "$KEYFILE" 2>&1 | head -20
          rm -f "$KEYFILE"

          echo "--- secret keys now in keyring ---"
          gpg --list-secret-keys --keyid-format=long
          if ! gpg --list-secret-keys "$APT_SIGNING_KEY_ID" > /dev/null 2>&1; then
              echo "::error::Key $APT_SIGNING_KEY_ID not found after import"
              exit 1
          fi

      - name: Configure non-interactive GPG for reprepro
        env:
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          {
            echo "pinentry-mode loopback"
            echo "use-agent"
          } >> ~/.gnupg/gpg.conf
          {
            echo "allow-loopback-pinentry"
            echo "default-cache-ttl 21600"
            echo "max-cache-ttl 21600"
          } >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          FPR=$(gpg --list-secret-keys --with-colons "$APT_SIGNING_KEY_ID" \
                | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$FPR" ]; then
              echo "::error::could not resolve fingerprint for configured signing key"
              exit 1
          fi
          echo "Trust fingerprint: $FPR"
          echo "${FPR}:6:" | gpg --import-ownertrust

      - name: Checkout or create gh-pages worktree
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
              echo "gh-pages branch exists — fetching"
              git fetch origin gh-pages
              git worktree add gh-pages-dir gh-pages
          else
              echo "gh-pages branch missing — creating orphan"
              git worktree add --detach gh-pages-dir
              cd gh-pages-dir
              git checkout --orphan gh-pages
              git rm -rf . || true
              touch .nojekyll   # disable Jekyll so files starting with _ are served
              echo "# VPNRouter APT Repository" > index.md
              cd ..
          fi

      - name: Lay out apt repo skeleton
        run: |
          mkdir -p gh-pages-dir/apt/conf
          cp packaging/apt-repo/distributions gh-pages-dir/apt/conf/distributions
          gpg --dearmor \
              < packaging/apt-repo/vpnrouter-apt-public.asc \
              > gh-pages-dir/apt/key.gpg
          cp packaging/apt-repo/vpnrouter-apt-public.asc gh-pages-dir/apt/vpnrouter.asc
          cat > gh-pages-dir/apt/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>VPNRouter APT Repository</title>
          <style>body{font:14px/1.5 system-ui,sans-serif;max-width:720px;margin:3em auto;padding:0 1em;color:#222}code,pre{background:#f4f4f4;padding:2px 6px;border-radius:3px;font-size:13px}pre{padding:12px;overflow:auto}h1{font-size:1.6em}</style>
          <h1>VPNRouter APT Repository</h1>
          <p>Add this repository to Debian/Ubuntu/Mint and install via <code>apt</code>:</p>
          <pre>curl -fsSL https://pavellizunov.github.io/VPNRouter/apt/key.gpg \
            | sudo tee /etc/apt/keyrings/vpnrouter.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/vpnrouter.gpg] https://pavellizunov.github.io/VPNRouter/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/vpnrouter.list
          sudo apt update
          sudo apt install vpnrouter</pre>
          <p>After that, <code>sudo apt upgrade</code> keeps VPNRouter up to date.</p>
          <p><a href="https://github.com/PavelLizunov/VPNRouter">&larr; GitHub</a></p>
          HTML

      - name: Download and validate latest published stable DEB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir .apt-debs
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > .apt-releases.json
          TAG=$(jq -ers '
            [ .[][]
              | select(.draft == false and .prerelease == false)
              | select(.tag_name | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
              ] | sort_by(.published_at) | last | .tag_name // error("No published stable release")
          ' .apt-releases.json)
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,assets > .apt-selected.json
          DEB="VPNRouter-$TAG-linux-amd64.deb"
          jq -e --arg tag "$TAG" --arg deb "$DEB" '
            .tagName == $tag and .isDraft == false and .isPrerelease == false
            and ([.assets[] | select(.name == $deb)] | length) == 1
            and ([.assets[] | select(.name == ($deb + ".sha256"))] | length) == 1
          ' .apt-selected.json > /dev/null
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$DEB" --pattern "$DEB.sha256" --dir .apt-debs
          cd .apt-debs
          test -s "$DEB"
          test -s "$DEB.sha256"
          read -r HASH FILE < "$DEB.sha256"
          [[ "$HASH" =~ ^[a-fA-F0-9]{64}$ ]]
          test "$FILE" = "$DEB"
          test "$(wc -l < "$DEB.sha256")" -eq 1
          printf '%s  %s\n' "$HASH" "$DEB" | sha256sum --check --strict -
          test "$(dpkg-deb --field "$DEB" Package)" = "vpnrouter"
          test "$(dpkg-deb --field "$DEB" Version)" = "${TAG#v}"
          test "$(dpkg-deb --field "$DEB" Architecture)" = "amd64"
          echo "APT reindex selected $TAG (run provenance: $GITHUB_REF_NAME); candidates are never included"

      - name: Ensure gh-pages root metadata (CNAME, .nojekyll, index.md)
        run: |
          printf 'vpn.ninitux.com' > gh-pages-dir/CNAME

          touch gh-pages-dir/.nojekyll
          echo "# VPNRouter APT Repository" > gh-pages-dir/index.md

      - name: Publish install scripts (Linux + Windows) to gh-pages root
        run: |
          sed 's/\r$//' packaging/apt-repo/install.sh > gh-pages-dir/install.sh
          chmod 755 gh-pages-dir/install.sh
          cp gh-pages-dir/install.sh gh-pages-dir/apt/install.sh

          sed 's/\r$//' packaging/windows/install.ps1   > gh-pages-dir/install.ps1
          sed 's/\r$//' packaging/windows/uninstall.ps1 > gh-pages-dir/uninstall.ps1
          sed 's/\r$//' packaging/windows/diagnose.ps1  > gh-pages-dir/diagnose.ps1

          mkdir -p gh-pages-dir/android
          cp packaging/android-page/index.html gh-pages-dir/android/index.html
          sed 's/\r$//' packaging/windows/repair.cmd > /tmp/repair-lf.cmd
          sed 's/$/\r/' /tmp/repair-lf.cmd > gh-pages-dir/repair.cmd
          chmod 755 gh-pages-dir/repair.cmd
          chmod 644 gh-pages-dir/install.ps1 gh-pages-dir/uninstall.ps1 gh-pages-dir/diagnose.ps1
          cat > gh-pages-dir/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <meta charset="utf-8">
          <title>VPNRouter - Install</title>
          <style>
            body{font:14px/1.5 system-ui,-apple-system,sans-serif;max-width:720px;margin:3em auto;padding:0 1em;color:#222}
            code,pre{background:#f4f4f4;padding:2px 6px;border-radius:3px;font-size:13px;font-family:ui-monospace,SF Mono,monospace}
            pre{padding:12px;overflow:auto}
            h1{font-size:1.7em;margin-bottom:.2em}
            h2{font-size:1.1em;margin-top:1.8em;margin-bottom:.3em}
            .sub{color:#666;margin:0 0 1.8em}
            a{color:#0366d6;text-decoration:none}
            a:hover{text-decoration:underline}
            .plat{font-size:.9em;color:#888}
          </style>
          <h1>VPNRouter</h1>
          <p class="sub">Process-based split-tunnel VPN router. Routes selected apps through VLESS+Reality via sing-box TUN, everything else goes direct. <a href="https://github.com/PavelLizunov/VPNRouter">Source</a>.</p>

          <h2>Linux <span class="plat">(Debian / Ubuntu / Mint / Pop / elementary)</span></h2>
          <pre>curl -fsSL https://vpn.ninitux.com/install.sh | sudo sh</pre>
          <p>Adds the signed apt repository, installs <code>vpnrouter</code>, enables passwordless VPN via POSIX capabilities. Updates: <code>sudo apt upgrade</code>.</p>

          <h2>macOS <span class="plat">(Apple Silicon, via Homebrew Cask)</span></h2>
          <pre>brew install --cask pavellizunov/vpnrouter/vpnrouter</pre>
          <p>Installs to <code>/Applications/VPNRouter.app</code>. First launch prompts once for sudoers setup, then passwordless. Updates: <code>brew upgrade --cask vpnrouter</code>.</p>

          <h2>Windows <span class="plat">(10 / 11, x64)</span></h2>
          <p>Run in PowerShell (auto-elevates via UAC):</p>
          <pre>iwr -useb https://vpn.ninitux.com/install.ps1 | iex</pre>
          <p>Installs to <code>C:\Program Files\VPNRouter</code>, registers Start Menu + Add/Remove Programs. Updates: re-run the same command. Uninstall: Settings &rarr; Apps &rarr; VPNRouter, or <code>iwr -useb https://vpn.ninitux.com/uninstall.ps1 | iex</code>.</p>

          <h2>Manual download</h2>
          <p>All platforms, including tar.gz / AppImage for non-Debian Linux: <a href="https://github.com/PavelLizunov/VPNRouter/releases/latest">GitHub Releases</a>.</p>
          <p>Traditional apt setup (without one-liner): see <a href="apt/">/apt/</a>.</p>
          </html>
          HTML

      - name: Add validated DEB and verify signed indexes
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(.apt-debs/*.deb)
          test "${#debs[@]}" -eq 1
          rm -rf gh-pages-dir/apt/db gh-pages-dir/apt/pool gh-pages-dir/apt/dists
          reprepro -Vb gh-pages-dir/apt includedeb stable "${debs[0]}"
          reprepro -b gh-pages-dir/apt check
          test -s gh-pages-dir/apt/dists/stable/main/binary-amd64/Packages
          grep -qx 'Package: vpnrouter' gh-pages-dir/apt/dists/stable/main/binary-amd64/Packages
          test -s gh-pages-dir/apt/dists/stable/Release
          test -s gh-pages-dir/apt/dists/stable/InRelease
          test -s gh-pages-dir/apt/dists/stable/Release.gpg
          gpgv --keyring "$PWD/gh-pages-dir/apt/key.gpg" \
              gh-pages-dir/apt/dists/stable/Release.gpg gh-pages-dir/apt/dists/stable/Release
          gpgv --keyring "$PWD/gh-pages-dir/apt/key.gpg" \
              --output .apt-signed-release gh-pages-dir/apt/dists/stable/InRelease
          cmp .apt-signed-release gh-pages-dir/apt/dists/stable/Release
          (cd gh-pages-dir/apt/dists/stable &&
              awk '/^SHA256:/ {on=1; next} /^[^ ]/ {on=0} on {print $1 "  " $3}' Release |
              sha256sum --check --strict -)

      - name: Publish gh-pages (single orphan commit, force-push)
        run: |
          cd gh-pages-dir
          git checkout --orphan _publish
          git add -A
          if git diff --cached --quiet; then
              echo "::error::gh-pages working tree is empty — refusing to publish an empty site"
              exit 1
          fi
          MSG="Publish stable APT reindex (run $GITHUB_REF_NAME at $GITHUB_SHA)"
          git commit -q -m "$MSG"
          git push --force origin HEAD:gh-pages
          echo "Published gh-pages as a single orphan commit: $MSG"

      - name: Print installation snippet
        run: |
          cat <<EOF
          ====================================================================
          Published to https://pavellizunov.github.io/VPNRouter/apt/
          ====================================================================

          To install VPNRouter on a Debian/Ubuntu/Mint machine:

          curl -fsSL https://pavellizunov.github.io/VPNRouter/apt/key.gpg \
              | sudo tee /etc/apt/keyrings/vpnrouter.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/vpnrouter.gpg] https://pavellizunov.github.io/VPNRouter/apt stable main" \
              | sudo tee /etc/apt/sources.list.d/vpnrouter.list
          # NB: key.gpg is served in binary (dearmored) form, so plain
          # `tee` into the keyring works — no `gpg --dearmor` step needed.
          sudo apt update && sudo apt install vpnrouter

          ====================================================================
          EOF
