name: Arch headless package

on:
  push:
    branches: [main, dsh/omarchy-mvp-2026-10-22]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-headless-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: archlinux:latest
      options: --cap-add NET_ADMIN --device-cgroup-rule "c 10:200 rwm"
    env:
      DOTNET_INSTALL_DIR: /opt/vpnrouter-dotnet
    steps:
      - name: Install build and runtime tools
        run: pacman -Syu --noconfirm --needed base-devel git python dotnet-sdk-10.0 libcap libarchive iproute2
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Check packaging contracts and pacman upgrade ordering
        run: python -m unittest discover -s packaging/arch/tests -v
      - name: Install repository-pinned .NET SDK in CI
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned runtime source-build Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build and inspect package as unprivileged builder
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env DOTNET_ROOT="$DOTNET_ROOT" python packaging/arch/build_package.py \
            --repo "$GITHUB_WORKSPACE" --work-dir /tmp/vpnrouter-arch-build --source-sha "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT"
          pkgver="0.1.0.r${GITHUB_RUN_NUMBER}.g${GITHUB_SHA:0:7}"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          test -f "/tmp/vpnrouter-arch-build/pkgbuild/vpnrouter-headless-${pkgver}-${GITHUB_RUN_ATTEMPT}-x86_64.pkg.tar.zst"
      - name: Install package and verify file capabilities
        shell: bash
        run: |
          set -euo pipefail
          pacman -U --noconfirm /tmp/vpnrouter-arch-build/pkgbuild/*.pkg.tar.zst
          pkgver="0.1.0.r${GITHUB_RUN_NUMBER}.g${GITHUB_SHA:0:7}"
          test "$(pacman -Q vpnrouter-headless)" = "vpnrouter-headless ${pkgver}-${GITHUB_RUN_ATTEMPT}"
          test "$(vercmp "${pkgver}-${GITHUB_RUN_ATTEMPT}" 0.1.0-1)" = 1
          getcap /usr/lib/vpnrouter-headless/runtime/sing-box | tee /tmp/vpnrouter-arch-build/getcap.txt
          grep -F 'cap_net_admin,cap_net_raw=ep' /tmp/vpnrouter-arch-build/getcap.txt
          # Match the private runtime directory created by pam_systemd on Omarchy.
          install -d -m 700 -o builder -g builder "/run/user/$(id -u builder)"
          python packaging/arch/installed_smoke.py --source-sha "$GITHUB_SHA" --offline
          # Reinstall must restore the xattr after the package file is replaced.
          pacman -U --noconfirm /tmp/vpnrouter-arch-build/pkgbuild/*.pkg.tar.zst
          getcap /usr/lib/vpnrouter-headless/runtime/sing-box | grep -F 'cap_net_admin,cap_net_raw=ep'
      - name: Upload exact-head Arch package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vpnrouter-headless-arch-${{ steps.build.outputs.pkgver }}-${{ github.run_attempt }}
          path: |
            /tmp/vpnrouter-arch-build/pkgbuild/*.pkg.tar.zst
            /tmp/vpnrouter-arch-build/pkgbuild/*.pkg.tar.zst.sha256
            /tmp/vpnrouter-arch-build/stage/usr/lib/vpnrouter-headless/manifest.json
            /tmp/vpnrouter-arch-build/getcap.txt
            /tmp/vpnrouter-arch-build/runtime-close-red.log
          if-no-files-found: error
          retention-days: 30
