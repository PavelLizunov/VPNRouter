name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without 'v' prefix, e.g. 2.32.1)"
        required: true
        type: string
      upload_to_release:
        description: "Upload built APK + sha256 to the matching GitHub release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # needed to upload release assets

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Validate requested version and dispatch ref
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-r[1-9][0-9]*)?$ ]]; then
            echo "::error::Expected X.Y.Z or X.Y.Z-rN (N >= 1)."
            exit 1
          fi
          TAG="v$VERSION"
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::Run workflow_dispatch with --ref $TAG; branch refs and mismatched tags are forbidden."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify requested tag and full AppVersion
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          TAG_SHA=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$TAG_SHA" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Requested tag does not point to the exact workflow commit."
            exit 1
          fi
          APPVER=$(sed -nE 's/^[[:space:]]*public static readonly string Version = "([^"]+)";.*/\1/p' VPNRouter.Core/AppVersion.cs)
          if [ "$APPVER" != "$VERSION" ]; then
            echo "::error::AppVersion/tag mismatch; full version including -rN must match."
            exit 1
          fi

      - name: Setup .NET 8 + 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.301

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.dotnet/workloads
          key: dotnet-workloads-${{ runner.os }}-${{ hashFiles('**/global.json') }}
          restore-keys: |
            dotnet-workloads-${{ runner.os }}-

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4

      - name: Install Android SDK platform 36
        run: |
          set -euo pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Decode signing keystore
        id: keystore_decode
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required to build the signed APK."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/vpnrouter.keystore"
          test -s "$GITHUB_WORKSPACE/vpnrouter.keystore"
          echo "Keystore decoded: $(stat -c '%s bytes' "$GITHUB_WORKSPACE/vpnrouter.keystore")"

      - name: Provision libbox.aar from the sing-box-vpnctl release
        id: libbox_provision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBBOX_SOURCE_REPO: "PavelLizunov/sing-box-vpnctl"
          LIBBOX_RELEASE_TAG: "v1.14.2-vpnctl.2"
          LIBBOX_ASSET: "libbox-legacy-1.14.2-vpnctl.2.aar"
          LIBBOX_AAR_SHA256: "c09d4bbbe99cc1bf541dcd0b414f8b0edcf727c5a1cdbfe4b69e5aed12d13631"
        run: |
          set -euo pipefail
          mkdir -p VPNRouter.Android/Lib
          if ! gh release download "$LIBBOX_RELEASE_TAG" \
               --repo "$LIBBOX_SOURCE_REPO" \
               --pattern "$LIBBOX_ASSET" \
               --output VPNRouter.Android/Lib/libbox.aar 2>&1; then
            echo "::error::Failed to fetch $LIBBOX_ASSET from $LIBBOX_SOURCE_REPO $LIBBOX_RELEASE_TAG."
            exit 1
          fi
          test -s VPNRouter.Android/Lib/libbox.aar
          ACTUAL_SHA="$(sha256sum VPNRouter.Android/Lib/libbox.aar | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$LIBBOX_AAR_SHA256" ]; then
            echo "::error::libbox.aar SHA256 mismatch on $LIBBOX_SOURCE_REPO $LIBBOX_RELEASE_TAG"
            echo "  expected: $LIBBOX_AAR_SHA256"
            echo "  actual:   $ACTUAL_SHA"
            echo "  If you intentionally moved to another core release, bump LIBBOX_RELEASE_TAG, LIBBOX_ASSET and LIBBOX_AAR_SHA256 together. See .github/SECRETS.md."
            exit 1
          fi
          gh attestation verify VPNRouter.Android/Lib/libbox.aar --repo "$LIBBOX_SOURCE_REPO"
          echo "libbox.aar provisioned + SHA256 and build attestation verified ($(stat -c '%s bytes' VPNRouter.Android/Lib/libbox.aar)) from $LIBBOX_SOURCE_REPO $LIBBOX_RELEASE_TAG"

      - name: dotnet publish (android-arm64, signed)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS_PASS:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is not set."
            exit 1
          fi
          dotnet publish VPNRouter.Android/VPNRouter.Android.csproj \
            -c Release \
            -p:VpnRouterVersion="${{ steps.version.outputs.version }}" \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/vpnrouter.keystore" \
            -p:AndroidSigningStorePass="$KS_PASS" \
            -p:AndroidSigningKeyAlias=vpnrouter \
            -p:AndroidSigningKeyPass="$KS_PASS"

      - name: Locate + rename APK
        id: apk
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          APK_SRC=$(find VPNRouter.Android/bin/Release -name "com.ninitux.vpnrouter-Signed.apk" -type f | head -1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::Signed APK not found. Build artifacts:"
            find VPNRouter.Android/bin -type f -name "*.apk" || true
            exit 1
          fi
          APK_OUT="VPNRouter-v${VER}-android-arm64.apk"
          cp "$APK_SRC" "$APK_OUT"
          ls -lh "$APK_OUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"

      - name: Verify the APK is arm64-only and its core keeps AWG and XHTTP
        run: |
          set -euo pipefail
          APKS=("${{ steps.apk.outputs.apk }}")
          for APK in "${APKS[@]}"; do
            ABIS="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')"
            echo "$APK native ABIs: $ABIS"
            if [ "$ABIS" != "arm64-v8a " ]; then
              echo "::error::$APK must carry arm64-v8a native libraries only, found: $ABIS"
              exit 1
            fi
            WORK="$(mktemp -d)"
            unzip -q -o "$APK" lib/arm64-v8a/libbox.so -d "$WORK"
            TAGS="$(grep -a -o -m1 -- '-tags=with_[A-Za-z0-9_,]*' "$WORK/lib/arm64-v8a/libbox.so" || true)"
            echo "libbox build tags: $TAGS"
            for NEED in with_awg with_xhttp; do
              case ",${TAGS#-tags=}," in
                *",$NEED,"*) ;;
                *) echo "::error::libbox.so was built without $NEED"; exit 1 ;;
              esac
            done
            rm -rf "$WORK"
          done

      - name: Verify production signing identity
        env:
          EXPECTED_CERT_SHA256: 6e50af0f51ff021db30883eca9fd5d4e66c18d7d64fab3b1b346942bf045a221
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.apk }}"
          ACTUAL_CERT_SHA256=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr '[:upper:]' '[:lower:]')
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Android signing certificate mismatch: expected=$EXPECTED_CERT_SHA256 actual=$ACTUAL_CERT_SHA256"
            exit 1
          fi

      - name: Compute SHA256
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.apk }}"
          sha256sum "$APK" | awk '{print $1"  "$2}' > "${APK}.sha256"
          echo "→ $(cat "${APK}.sha256")"

      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-build-v${{ steps.version.outputs.version }}
          path: |
            VPNRouter-v*-android-arm64.apk
            VPNRouter-v*-android-arm64.apk.sha256
          retention-days: 30

      - name: Upload to GitHub Release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.apk.outputs.apk }}"

          git fetch --no-tags origin "refs/tags/$TAG"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]; then
            echo "::error::Remote tag changed since this workflow started."
            exit 1
          fi
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release must already exist and remain a draft; refusing upload."
            exit 1
          fi

          echo "Uploading APK + sha256 to release $TAG..."
          gh release upload "$TAG" \
            "$APK" \
            "${APK}.sha256" \
            --repo "$GITHUB_REPOSITORY"
          echo "✓ Uploaded APK + sha256 to $TAG"
