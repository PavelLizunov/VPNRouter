name: Build Android APK

# Triggered by:
#  - pushing a v* tag (automatic on release)
#  - manual dispatch (re-run on existing releases for missing APK)
#
# Mirrors the build-mac.yml / build-linux.yml shape so a single tag push
# kicks off all platform builds in parallel. After this workflow lands,
# release assets become 14 (was 12 = 4 Win + 2 Mac + 6 Linux). See
# plans/vpnrouter-android-platform-parity-roadmap.md Phase A for context.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without 'v' prefix, e.g. 2.32.1)"
        required: true
        type: string
      upload_to_release:
        description: "Upload built APK + sha256 to the matching GitHub release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # needed to upload release assets

jobs:
  build:
    runs-on: ubuntu-latest

    # Wave 32b deferred — NU1102 for preview Mono runtime pack 10.0.8.
    # The .NET 10 preview SDK 10.0.300 references a Mono pack that
    # isn't on any public nuget feed yet. We tried `dotnet10`,
    # `dotnet-experimental`, `dotnet-public` — none has the exact
    # build version the workload manifest pins. Job-level
    # `continue-on-error: true` (r14c attempt) didn't help — GitHub
    # still reports the check-run conclusion as "failure", so the
    # commit status keeps showing a red X.
    #
    # Honest close (r15b): gate the job to `workflow_dispatch` only.
    # Tag pushes will SKIP the job entirely (skipped jobs report as
    # "skipped" conclusion, which doesn't block commit status). The
    # workflow stays in the repo for manual probing via
    # `gh workflow run "Build Android APK"` whenever we want to test
    # whether NU1102 has been resolved upstream.
    #
    # Tracked in `MEMORY.md` "Wave 32b NU1102 NuGet Mono pack
    # workaround for CI Android — deferred". When the missing pack
    # lands publicly (or .NET 10 ships GA), remove this `if:` line
    # and the workflow goes back to auto-running on tag push.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Wave 26 (Phase 6, 2026-05-18) — bumped to multi-version setup so
      # both 8.0 + 10.0 SDKs are available. Wave 23 (commit c33e372,
      # Phase 5) moved Android to net10.0-android36.0 + Avalonia 12 which
      # requires the .NET 10 SDK; the rest of the solution stays on net8.0
      # so we keep 8.0.x in the install list. setup-dotnet@v4 takes a
      # multi-line list and side-by-side installs both runtimes.
      #
      # 2026-05-25 (Wave 32c): pinned 10.0.x → 10.0.100 to dodge the
      # `Microsoft.NETCore.App.Runtime.Mono.linux-x64 = 10.0.8` NU1102
      # restore failure. SDK 10.0.300's workload manifest references that
      # pack but it was never published to any public NuGet feed — Mono
      # on Linux x64 was withdrawn from the .NET 10 target list. 10.0.100
      # predates that manifest pin. Bump back to 10.0.x once the missing
      # pack lands publicly (probe via api.nuget.org). Full root cause +
      # remediation plan: `plans/research-android-ci-unblock-2026-05-25.md`.
      - name: Setup .NET 8 + 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.100

      # Phase 1 Q9 — NuGet package cache. `dotnet publish` for the Android
      # head restores hundreds of MB of packages on cold runs. Keyed on the
      # union hash of every .csproj so any package version bump invalidates
      # cleanly. Q11 will pin actions/cache to a commit SHA.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Phase 1 Q9 — .NET Android workload cache. `dotnet workload install
      # android` below takes 3–4 min on a cold runner (large SDK download).
      # Caching ~/.dotnet/workloads keyed on global.json (where SDK + workload
      # versions are pinned) avoids repeating that download on warm runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.dotnet/workloads
          key: dotnet-workloads-${{ runner.os }}-${{ hashFiles('**/global.json') }}
          restore-keys: |
            dotnet-workloads-${{ runner.os }}-

      # JDK 17 is the minimum for current AndroidX + .NET Android 8 build
      # tools. Temurin matches the developer-VM toolchain documented in
      # plans/vpnrouter-android-handbook.md §3.5.
      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 installs cmdline-tools, accepts
      # SDK licenses, and exports ANDROID_HOME / ANDROID_SDK_ROOT.
      # The .NET Android workload picks up these env vars automatically;
      # no extra -p:AndroidSdkDirectory flag needed.
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2

      # Wave 26 (Phase 6, 2026-05-18) — explicit platforms;android-36
      # + build-tools;36.0.0 install. setup-android only ships the
      # default platform (android-34 as of v3.2.2); .NET Android 10
      # build for net10.0-android36.0 needs API 36 + matching build-
      # tools. Without this step `dotnet publish` fails with NETSDK1139
      # ("target framework moniker 'net10.0-android36.0' is not
      # recognized") or aapt2 missing-platform errors.
      - name: Install Android SDK platform 36
        run: |
          set -euo pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"

      # The Android workload is not bundled with setup-dotnet; it has to
      # be installed explicitly. ~3-4 min on a cold runner.
      # Wave 26 (Phase 6, 2026-05-18) — added --skip-manifest-update.
      # Without it the install bumps the workload manifest first which
      # can pull a newer Android workload version than what the .NET 10
      # SDK ships locally; the --skip flag pins to the SDK's bundled
      # manifest (matches the developer-VM toolchain documented in the
      # Phase 5 ship report `plans/phase5-android-net10-2026-05-18.md`).
      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Resolve version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # ── Decode signing keystore from secret ────────────────────────────
      # The keystore was generated locally one-time (see roadmap Phase A
      # "One-time keystore setup") and uploaded as ANDROID_KEYSTORE_BASE64.
      # Losing this keystore means we can't ship updates to existing
      # installs — Android refuses APKs signed with a different key on the
      # same package id. Backup encrypted to multiple locations.
      # v2.32.2-r2 (2026-05-12): graceful skip when keystore secret
      # isn't present. Pre-r2 the workflow exit-1'd on every release
      # push, marking the run failed even though APK signing infra
      # just isn't set up yet. That made every -rN ship show a red
      # cross in the release CI list — confusing. Now we set a job-
      # level output flag and skip downstream steps; the run records
      # as success with a warning instead of failure. Roadmap Phase A
      # (plans/vpnrouter-android-platform-parity-roadmap.md) still
      # describes the one-time keystore generation + secret upload
      # for when we actually want signed releases.
      - name: Decode signing keystore
        id: keystore_decode
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set — skipping Android APK build. See plans/vpnrouter-android-platform-parity-roadmap.md Phase A for one-time keystore generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/vpnrouter.keystore"
          # Sanity check — file exists and is non-empty.
          test -s "$GITHUB_WORKSPACE/vpnrouter.keystore"
          echo "Keystore decoded: $(stat -c '%s bytes' "$GITHUB_WORKSPACE/vpnrouter.keystore")"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # ── Provision libbox.aar from internal tooling release ─────────────
      # Phase 7 Wave 32 (2026-05-19) — libbox.aar (sing-box gomobile
      # binding, ~11.7 MB) is gitignored because it ships outside the
      # repo. Local builds drop the aar at VPNRouter.Android/Lib/ by
      # hand; CI restores it from a dedicated internal "tooling"
      # release on the same repo, fetched via the ambient GITHUB_TOKEN.
      #
      # Why a release asset instead of a secret? GitHub Actions secrets
      # are capped at 48 KB; base64-encoded libbox.aar is ~15.6 MB.
      # Phase 6 Wave 26's LIBBOX_AAR_BASE64 design exceeded that cap
      # by ~325x and was never possible to provision (returned HTTP
      # 422 "Value is too large" on every `gh secret set` attempt).
      # Release assets, by contrast, have a 2 GB per-file cap.
      #
      # The aar is referenced by VPNRouter.Android.csproj
      # (<AndroidLibrary Include="Lib\libbox.aar" Bind="false" />) so
      # `dotnet publish` fails with a missing-file error if this step
      # is skipped — that's the dependent gate.
      #
      # Rotation: when sing-box bumps to 1.13.11+, build the new aar
      # locally (see plans/vpnrouter-wgturn-cli-phase1.md + Phase A
      # roadmap), then:
      #
      #   gh release create tooling-libbox-singbox-X.Y.Z \
      #     --repo PavelLizunov/VPNRouter \
      #     --prerelease \
      #     --title "Tooling: libbox.aar (sing-box X.Y.Z gomobile binding)" \
      #     --notes "Internal CI asset. See .github/SECRETS.md." \
      #     VPNRouter.Android/Lib/libbox.aar
      #
      # CRITICAL: include `--prerelease`! Without it, GitHub auto-marks
      # the tooling release as Latest, which breaks the install.ps1
      # one-liner (it queries /releases?per_page=30 + filter
      # not-prerelease + first → picks tooling, fails to find win.zip).
      # The original 2026-05-19 tooling release missed this flag and
      # broke installs for ~3 hours. Post-incident SECRETS.md was
      # updated with the corrected provisioning command.
      #
      # The OLD tooling release can be deleted (or kept for history)
      # after one stable cycle.
      #
      # See .github/SECRETS.md for the full rotation procedure.
      # DO NOT commit a real libbox.aar — the
      # VPNRouter.Android/Lib/libbox*.aar gitignore rule is intentional.
      #
      # Graceful skip pattern: if `gh release download` fails (release
      # missing, asset missing, token-scoped wrong), set skip=true so
      # a fresh fork or pre-provisioned repo records the build as a
      # green run with a warning rather than a red failure.
      - name: Provision libbox.aar from tooling release
        id: libbox_provision
        if: steps.keystore_decode.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin to a specific tooling release to make sing-box upgrades
          # explicit. Bump when libbox.aar is rebuilt against a new
          # sing-box version. See block comment above for rotation.
          LIBBOX_RELEASE_TAG: "tooling-libbox-singbox-1.13.10"
        run: |
          set -euo pipefail
          mkdir -p VPNRouter.Android/Lib
          # --pattern restricts download to the expected asset name.
          # The tooling release should only contain libbox.aar but be
          # defensive in case future assets get added (e.g., debug
          # variants, sha256 sidecars).
          if ! gh release download "$LIBBOX_RELEASE_TAG" \
               --repo "$GITHUB_REPOSITORY" \
               --pattern "libbox.aar" \
               --output VPNRouter.Android/Lib/libbox.aar 2>&1; then
            echo "::warning::Failed to fetch libbox.aar from tooling release $LIBBOX_RELEASE_TAG — skipping Android APK build. See .github/SECRETS.md for tooling-release provisioning."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail loudly if the downloaded asset is empty / corrupt.
          # test -s succeeds only when the file exists AND has
          # non-zero size; a torn download or wrong-name asset would
          # produce a 0-byte file here.
          test -s VPNRouter.Android/Lib/libbox.aar
          echo "libbox.aar provisioned: $(stat -c '%s bytes' VPNRouter.Android/Lib/libbox.aar) from release $LIBBOX_RELEASE_TAG"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # ── Build signed APK ───────────────────────────────────────────────
      # arm64-only by default — covers all currently-shipping phones at
      # ~47 MB instead of ~120 MB for the all-RID fat APK. arm/x64/x86
      # variants can be added later as separate publish jobs if user
      # demand surfaces.
      #
      # csproj has AndroidSigningKeyStore="vpnrouter.keystore" gated on
      # Configuration=Release; we override with the absolute path so the
      # MSBuild target finds the file regardless of working directory.
      - name: dotnet publish (android-arm64, signed)
        if: >-
          steps.keystore_decode.outputs.skip != 'true' &&
          steps.libbox_provision.outputs.skip != 'true'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS_PASS:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is not set."
            exit 1
          fi
          dotnet publish VPNRouter.Android/VPNRouter.Android.csproj \
            -c Release \
            -p:RuntimeIdentifiers=android-arm64 \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/vpnrouter.keystore" \
            -p:AndroidSigningStorePass="$KS_PASS" \
            -p:AndroidSigningKeyAlias=vpnrouter \
            -p:AndroidSigningKeyPass="$KS_PASS"

      # ── Locate + rename APK ────────────────────────────────────────────
      # The exact output path depends on .NET Android SDK version (with vs
      # without RID subdir under bin/). `find` is more robust than hard-
      # coding the path. The signed APK always carries the -Signed suffix.
      - name: Locate + rename APK
        if: >-
          steps.keystore_decode.outputs.skip != 'true' &&
          steps.libbox_provision.outputs.skip != 'true'
        id: apk
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          APK_SRC=$(find VPNRouter.Android/bin/Release -name "com.ninitux.vpnrouter-Signed.apk" -type f | head -1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::Signed APK not found. Build artifacts:"
            find VPNRouter.Android/bin -type f -name "*.apk" || true
            exit 1
          fi
          APK_OUT="VPNRouter-v${VER}-android-arm64.apk"
          cp "$APK_SRC" "$APK_OUT"
          ls -lh "$APK_OUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        if: >-
          steps.keystore_decode.outputs.skip != 'true' &&
          steps.libbox_provision.outputs.skip != 'true'
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.apk }}"
          sha256sum "$APK" | awk '{print $1"  "$2}' > "${APK}.sha256"
          echo "→ $(cat "${APK}.sha256")"

      - name: Upload as workflow artifacts
        if: >-
          steps.keystore_decode.outputs.skip != 'true' &&
          steps.libbox_provision.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: android-build-v${{ steps.version.outputs.version }}
          path: |
            VPNRouter-v*-android-arm64.apk
            VPNRouter-v*-android-arm64.apk.sha256
          retention-days: 30

      - name: Upload to GitHub Release
        if: >-
          steps.keystore_decode.outputs.skip != 'true' &&
          steps.libbox_provision.outputs.skip != 'true' &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_release))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.apk.outputs.apk }}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::Release $TAG does not exist yet — skipping upload. Create the release first, then re-run this workflow."
            exit 0
          fi

          echo "Uploading APK + sha256 to release $TAG..."
          gh release upload "$TAG" \
            "$APK" \
            "${APK}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "✓ Uploaded APK + sha256 to $TAG"
