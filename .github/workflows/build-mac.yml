name: Build macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without 'v' prefix, e.g. 2.13.12)"
        required: true
        type: string
      upload_to_release:
        description: "Upload built DMG + ZIP to the matching GitHub release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # needed to upload release assets

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Validate requested version and dispatch ref
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-r[1-9][0-9]*)?$ ]]; then
            echo "::error::Expected X.Y.Z or X.Y.Z-rN (N >= 1)."
            exit 1
          fi
          TAG="v$VERSION"
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::Run workflow_dispatch with --ref $TAG; branch refs and mismatched tags are forbidden."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify requested tag and full AppVersion
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          TAG_SHA=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$TAG_SHA" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Requested tag does not point to the exact workflow commit."
            exit 1
          fi
          APPVER=$(sed -nE 's/^[[:space:]]*public static readonly string Version = "([^"]+)";.*/\1/p' VPNRouter.Core/AppVersion.cs)
          if [ "$APPVER" != "$VERSION" ]; then
            echo "::error::AppVersion/tag mismatch; full version including -rN must match."
            exit 1
          fi

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build macOS DMG + ZIP
        run: |
          chmod +x ./build-mac.sh
          ./build-mac.sh "${{ steps.version.outputs.version }}"

      - name: Smoke test - sing-box accepts our config shape
        continue-on-error: true
        run: |
          set -e
          SINGBOX="/tmp/VPNRouter.app/Contents/MacOS/sing-box"
          if [ ! -x "$SINGBOX" ]; then
            ALT=$(find /tmp /private/tmp "$RUNNER_TEMP" -maxdepth 4 -name sing-box -path "*Contents/MacOS*" -type f 2>/dev/null | head -1)
            if [ -n "$ALT" ]; then
              SINGBOX="$ALT"
            else
              echo "::warning::staged sing-box not found (looked at $SINGBOX) - smoke test skipped"
              exit 0
            fi
          fi
          echo "Found sing-box at $SINGBOX"
          "$SINGBOX" version || echo "::warning::sing-box version check failed"
          cat > /tmp/sb-smoke.json << 'EOF'
          {
            "log": { "level": "info" },
            "dns": {
              "servers": [{ "tag": "default", "type": "udp", "server": "1.1.1.1" }],
              "rules": []
            },
            "inbounds": [],
            "outbounds": [{ "type": "direct", "tag": "direct" }],
            "route": { "rules": [], "final": "direct" }
          }
          EOF
          "$SINGBOX" check -c /tmp/sb-smoke.json
          echo "smoke test PASSED"

      - name: Locate artifacts
        id: artifacts
        run: |
          DMG="/tmp/VPNRouter-v${{ steps.version.outputs.version }}-mac.dmg"
          ZIP="/tmp/VPNRouter-v${{ steps.version.outputs.version }}-mac.zip"
          ls -la "$DMG" "$ZIP"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 sidecars
        id: artifacts-sha
        run: |
          set -euo pipefail
          DMG="${{ steps.artifacts.outputs.dmg }}"
          ZIP="${{ steps.artifacts.outputs.zip }}"
          for f in "$DMG" "$ZIP"; do
            BASENAME=$(basename "$f")
            (cd "$(dirname "$f")" && shasum -a 256 "$BASENAME" > "${BASENAME}.sha256")
            echo "→ $(cat "${f}.sha256")"
          done
          echo "dmg_sha=${DMG}.sha256" >> "$GITHUB_OUTPUT"
          echo "zip_sha=${ZIP}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifacts (always — preserves build even if release upload fails)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-build-v${{ steps.version.outputs.version }}
          path: |
            /tmp/VPNRouter-v*-mac.dmg
            /tmp/VPNRouter-v*-mac.zip
            /tmp/VPNRouter-v*-mac.dmg.sha256
            /tmp/VPNRouter-v*-mac.zip.sha256
          retention-days: 30

      - name: Upload to GitHub Release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          DMG="${{ steps.artifacts.outputs.dmg }}"
          ZIP="${{ steps.artifacts.outputs.zip }}"
          DMG_SHA="${{ steps.artifacts-sha.outputs.dmg_sha }}"
          ZIP_SHA="${{ steps.artifacts-sha.outputs.zip_sha }}"

          git fetch --no-tags origin "refs/tags/$TAG"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]; then
            echo "::error::Remote tag changed since this workflow started."
            exit 1
          fi
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release must already exist and remain a draft; refusing upload."
            exit 1
          fi

          echo "Uploading to release $TAG..."
          gh release upload "$TAG" "$DMG" "$ZIP" "$DMG_SHA" "$ZIP_SHA" --repo "$GITHUB_REPOSITORY"
          echo "✓ Uploaded DMG + ZIP + 2 SHA256 sidecars to $TAG"

      - name: Trigger Homebrew Cask update (stable only)
        if: >-
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.upload_to_release))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
              echo "::notice::Draft assets staged; Homebrew notification belongs after publication."
              exit 0
          fi

          case "$TAG" in
              *-r[0-9]*|*-rc*|*-beta*|*-alpha*|*-pre*)
                  echo "::notice::$TAG looks like a prerelease — not bumping Homebrew Cask"
                  exit 0
                  ;;
          esac

          IS_PRE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo "true")
          if [ "$IS_PRE" = "true" ]; then
              echo "::notice::$TAG is flagged prerelease on GitHub — not bumping Homebrew Cask"
              exit 0
          fi

          if [ -z "${TAP_TOKEN:-}" ]; then
              echo "::notice::HOMEBREW_TAP_DISPATCH_TOKEN secret is not configured — skipping tap dispatch. The tap's daily cron will pick up this release within 24h."
              exit 0
          fi

          echo "Dispatching vpnrouter-release event to PavelLizunov/homebrew-vpnrouter (version=$VERSION)"
          curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TAP_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/PavelLizunov/homebrew-vpnrouter/dispatches" \
              -d "{\"event_type\":\"vpnrouter-release\",\"client_payload\":{\"version\":\"$VERSION\",\"tag\":\"$TAG\"}}"
          echo "✓ Dispatched — tap's update-cask.yml should now be running"
