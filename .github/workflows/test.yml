name: dotnet test

# Phase 1 Q8 — primary regression gate for VPNRouter.Tests.
#
# Why this workflow exists:
#   765 tests live in VPNRouter.Tests but until now only ran locally. Any
#   commit could break the suite undetected until a developer happened to
#   run `dotnet test` on their machine. Phase 2 god-file splits cannot
#   begin safely without this CI gate. See plans/ci-audit-2026-05-17.md
#   "Key findings: NO test workflow" and plans/v3.0-refactor-roadmap.md
#   Phase 1 #8.
#
# Triggers: every push to main / v3.0-prep and every PR targeting either.
# Deliberately NO `paths:` filter — every push must verify the full suite,
# echoing the lesson from test-windows-update.yml whose hardcoded paths
# silently skipped during refactor work.
#
# Job id `test` is the contract: Wave 4 integrator will PATCH the GitHub
# branch-protection required-checks list to add `test` after this workflow
# has one green run on main. Do NOT rename the job without coordinating
# the protection update.
#
# Caching: not added here. Q9 owns the NuGet cache contract via
# actions/cache; this workflow stays restore-from-scratch until then so
# Q9 can introduce caching as a single atomic change.

on:
  push:
    branches: [main, v3.0-prep]
    # audit item 10 (2026-06-25): also run the full suite on release tags. A
    # stable `vX.Y.Z` tag previously triggered only build+upload (build-mac/linux)
    # and verify-release-integrity (string/hash/count) -- ZERO behavioral tests --
    # so a defect on a cut SHA differing from the last green -rN shipped to stable.
    # cut-stable Step 5 now waits for this `test` job on the stable tag before
    # un-drafting. (Re-runs on -rN tags too; redundant but ties tag -> green suite.)
    tags: ['v*']
  pull_request:
    branches: [main, v3.0-prep]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to full commit SHAs; Dependabot (github-actions) bumps them.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore VPNRouter.Tests/VPNRouter.Tests.csproj

      - name: Build
        run: dotnet build VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --no-restore

      # Excluded suites (TODO: re-enable once xvfb wrapper / display
      # bootstrap is in place):
      #   - HeadlessGuiTests, PageScreenshotTests, VisualDiffTests
      #     use Avalonia.Headless + Skia. Even with UseHeadlessDrawing=false
      #     and UseSkia(), they pull display-adjacent code paths that
      #     have not been validated on a bare ubuntu-latest runner. Run
      #     them locally on Windows for now; the Q-series follow-up will
      #     add `xvfb-run` (or equivalent) and lift this filter.
      #   - Filter uses xUnit's `FullyQualifiedName!~` operator, which
      #     matches any test whose FQN contains the substring — covers
      #     [Theory] cases too.
      - name: Test
        run: dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --no-build --filter "FullyQualifiedName!~Headless&FullyQualifiedName!~PageScreenshot&FullyQualifiedName!~VisualDiff" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"

      # `if: always()` so failed test runs still upload the .trx — that's
      # the diagnostic artifact the developer needs to triage. 30-day
      # retention matches build-linux.yml's convention.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ github.sha }}
          path: VPNRouter.Tests/TestResults/*.trx
          retention-days: 30

  # P01 UPD-2: VPNRouter.GUI/repair_test.go pins the ClickFix-safe `-File`
  # repair invocation. The package is Windows-only (syscall.SysProcAttr fields
  # do not cross-compile), so it cannot run in the ubuntu `test` job; run
  # `go test` on a Windows runner instead. Separate job keeps the .NET `test`
  # job id + filter untouched.
  go-test-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.21"
      - name: Go test (VPNRouter.GUI repair stub)
        working-directory: VPNRouter.GUI
        run: go test ./...

  # audit item 12 (P1-8): MainWindowViewModelCharacterizationTests hard-fails only
  # on Windows (it soft-returns the drifted hash on non-Windows), but CI ran
  # ubuntu-only -- so the public-surface guard could NEVER fail in CI and a
  # XAML-bound member rename/removal passed green. Run the characterization suite
  # on a Windows runner at cut time (tags) + on demand. The hash is reflection-
  # based and deterministic across machines, so it matches the dev-box
  # PinnedHashWindows. Kept off per-push to bound Windows-runner cost.
  characterization-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          global-json-file: global.json
      - name: Characterization (Windows hard-fail on public-surface drift)
        run: dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --filter "FullyQualifiedName~Characterization"
