name: dotnet test


on:
  push:
    branches: [main, v3.0-prep]
    tags: ['v*']
  pull_request:
    branches: [main, v3.0-prep]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore VPNRouter.Tests/VPNRouter.Tests.csproj

      - name: Build
        run: dotnet build VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --no-build --filter "FullyQualifiedName!~Headless&FullyQualifiedName!~PageScreenshot&FullyQualifiedName!~VisualDiff" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-${{ github.sha }}
          path: VPNRouter.Tests/TestResults/*.trx
          retention-days: 30

  go-test-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.21"
      - name: Go test (VPNRouter.GUI repair stub)
        working-directory: VPNRouter.GUI
        run: go test ./...

  characterization-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Publish CLI (Windows)
        run: dotnet publish VPNRouter.CLI/VPNRouter.CLI.csproj -c Release -r win-x64 --self-contained false -o "$env:RUNNER_TEMP\vpnrouter-cli"
      - name: Characterization and release-gate contracts (Windows)
        run: dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --filter "(FullyQualifiedName~Characterization|FullyQualifiedName~PostShipVerifierContractTests|FullyQualifiedName~BratVerifierContractTests|FullyQualifiedName~ReleaseDefectGateTests|FullyQualifiedName~ReleaseToolingContractTests|FullyQualifiedName~PlatformReleaseWorkflowTests|FullyQualifiedName~ReleaseSafetyBehaviorTests|FullyQualifiedName~ReleaseIntegrityWorkflowTests|FullyQualifiedName~AptReleaseWorkflowTests|FullyQualifiedName~PerformanceShareLinkTests|FullyQualifiedName~UrlValidationSecurityTests|FullyQualifiedName~Night|FullyQualifiedName~CommittedFirewallConfigTests|FullyQualifiedName~SingBoxManagerRestartTunLockTests|FullyQualifiedName~SingBoxManagerSuppressExitedEventTests|FullyQualifiedName~MvmTwoPhaseStartTimerTests|FullyQualifiedName~FreeConfigFetcherTests|FullyQualifiedName~ZapretAutoStrategyR4Tests|FullyQualifiedName~VPNRouter.Tests)&FullyQualifiedName!~PageScreenshot&FullyQualifiedName!~VisualDiff&FullyQualifiedName!~HeadlessGui" --blame-hang-timeout 4m --blame-hang-dump-type none
