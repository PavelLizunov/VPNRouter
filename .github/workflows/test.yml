name: dotnet test


on:
  push:
    branches: [main, v3.0-prep]
    tags: ['v*']
  pull_request:
    branches: [main, v3.0-prep]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Linux desktop update helper tests
        run: python3 -m unittest discover -s packaging/linux/tests -v

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json

      - name: Record selected SDK and bundled VSTest
        run: python .github/scripts/report-test-sdk.py
      - name: Restore
        run: dotnet restore VPNRouter.sln

      - name: Build
        run: dotnet build VPNRouter.sln -c Release --no-restore

      - name: Provision the pinned core for loopback verification
        working-directory: packaging/arch
        shell: python
        run: |
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path.cwd()))
          import build_package as package
          work = Path(os.environ["RUNNER_TEMP"]) / "vpnrouter-verifier"
          work.mkdir()
          archive = package.acquire_archive(package.RUNTIME_URL, package.RUNTIME_SHA256, "runtime.tar.gz", work, None)
          package.staging_tools.safe_extract(archive, work / "core", package.RUNTIME_SHA256)
          core = package.find_file(work / "core", "sing-box")
          core.chmod(0o700)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VPNROUTER_TEST_VERIFIER_RUNTIME={core}\n")

      - name: Test
        run: dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --no-build --filter "FullyQualifiedName!~Headless&FullyQualifiedName!~PageScreenshot&FullyQualifiedName!~VisualDiff" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-${{ github.sha }}
          path: VPNRouter.Tests/TestResults/*.trx
          retention-days: 30

  headless-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish headless without the GUI stack
        run: |
          dotnet publish VPNRouter.Headless/VPNRouter.Headless.csproj -c Release -r linux-x64 --self-contained false -o "$RUNNER_TEMP/vpnrouter-headless"
          test -f "$RUNNER_TEMP/vpnrouter-headless/VPNRouter.Headless.dll"
          if find "$RUNNER_TEMP/vpnrouter-headless" -iname '*Avalonia*' | grep -q .; then
            echo "Avalonia leaked into the headless publish" >&2
            exit 1
          fi

  headless-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
      - name: Headless contract checks
        run: timeout 8m dotnet run --project VPNRouter.Headless.Tests/VPNRouter.Headless.Tests.csproj -c Release

  packaging-arch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Arch packaging unit tests
        run: python3 -m unittest discover -s packaging/arch/tests -v

  go-test-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.21"
      - name: Go test (VPNRouter.GUI repair stub)
        working-directory: VPNRouter.GUI
        run: go test ./...

  characterization-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
      - name: Record selected SDK and bundled VSTest
        run: python .github/scripts/report-test-sdk.py
      - name: Publish CLI (Windows)
        run: dotnet publish VPNRouter.CLI/VPNRouter.CLI.csproj -c Release -r win-x64 --self-contained false -o "$env:RUNNER_TEMP\vpnrouter-cli"
      - name: Compile Windows installer scripts with a test payload
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
            if ((Get-FileHash -Algorithm SHA256 $setup).Hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') {
              throw 'Inno Setup installer checksum mismatch'
            }
            $toolsDir = Join-Path $env:RUNNER_TEMP 'inno-test-compiler'
            $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS /DIR=`"$toolsDir`"" -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed with $($install.ExitCode)" }
            $compiler = Join-Path $toolsDir 'ISCC.exe'
          }
          $payload = Join-Path $env:RUNNER_TEMP 'installer-test-payload'
          $output = Join-Path $env:RUNNER_TEMP 'installer-test-output'
          New-Item -ItemType Directory -Path "$payload\app", $output | Out-Null
          Copy-Item "$env:RUNNER_TEMP\vpnrouter-cli\VPNRouter.CLI.exe" "$payload\app"
          foreach ($script in Get-ChildItem 'packaging/windows/*.iss') {
            & $compiler /Q /DAppVersion=0.0.0 "/DPayloadDir=$payload" "/DOutputDir=$output" $script.FullName
            if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed for $($script.Name)" }
          }
          foreach ($file in Get-Item packaging/windows/install.ps1, packaging/windows/uninstall.ps1, packaging/windows/installer/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw ($errors -join [Environment]::NewLine) }
          }
      - name: Characterization and release-gate contracts (Windows)
        run: dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --filter "(FullyQualifiedName~Characterization|FullyQualifiedName~PostShipVerifierContractTests|FullyQualifiedName~BratVerifierContractTests|FullyQualifiedName~ReleaseDefectGateTests|FullyQualifiedName~ReleaseToolingContractTests|FullyQualifiedName~PlatformReleaseWorkflowTests|FullyQualifiedName~ReleaseSafetyBehaviorTests|FullyQualifiedName~ReleaseIntegrityWorkflowTests|FullyQualifiedName~AptReleaseWorkflowTests|FullyQualifiedName~PerformanceShareLinkTests|FullyQualifiedName~UrlValidationSecurityTests|FullyQualifiedName~Night|FullyQualifiedName~CommittedFirewallConfigTests|FullyQualifiedName~SingBoxManagerRestartTunLockTests|FullyQualifiedName~SingBoxManagerSuppressExitedEventTests|FullyQualifiedName~MvmTwoPhaseStartTimerTests|FullyQualifiedName~FreeConfigFetcherTests|FullyQualifiedName~ZapretAutoStrategyR4Tests|FullyQualifiedName~VPNRouter.Tests)&FullyQualifiedName!~PageScreenshot&FullyQualifiedName!~VisualDiff&FullyQualifiedName!~HeadlessGui" --logger "console;verbosity=normal" --blame-hang-timeout 4m --blame-hang-dump-type none
