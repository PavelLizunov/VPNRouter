name: Build Simple Windows preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PREVIEW_SOURCE: b926cefda60ae13be396632bd4359a2ca62caa27
    steps:
      - name: Checkout the exact preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PREVIEW_SOURCE }}
          persist-credentials: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: 1.26.1
      - name: Build unsigned Windows packages from the exact source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne $env:PREVIEW_SOURCE -or (git status --porcelain)) {
            throw 'Preview source checkout is not the requested clean commit.'
          }
          $text = Get-Content VPNRouter.Core/AppVersion.cs -Raw
          if ($text -notmatch 'string\s+Version\s*=\s*"([0-9.]+(?:-r[1-9][0-9]*)?)"') {
            throw 'Cannot read preview version.'
          }
          $version = $Matches[1]
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
            if ((Get-FileHash -Algorithm SHA256 $setup).Hash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') {
              throw 'Inno Setup installer checksum mismatch'
            }
            $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Inno Setup exited with $($install.ExitCode)" }
          }
          ./build.ps1 -Version $version -BundleSplitDriver -Installer
          if ($LASTEXITCODE -ne 0) { throw "Build exited with $LASTEXITCODE" }
          $output = Join-Path $env:RUNNER_TEMP 'windows-preview'
          New-Item -Path $output -ItemType Directory | Out-Null
          foreach ($name in @("VPNRouter-v$version-win.zip", "VPNRouter-update-v$version-win.zip", "VPNRouter-Setup-v$version.exe")) {
            $sidecar = (Get-Content "$name.sha256" -Raw).Trim()
            if ($sidecar -notmatch '^(?<hash>[0-9a-fA-F]{64})(?:\s+(?<file>.+))?$') {
              throw "Invalid checksum sidecar for $name"
            }
            if ($Matches['file'] -and $Matches['file'] -cne $name) { throw "Wrong filename in sidecar for $name" }
            if ($Matches['hash'] -ne (Get-FileHash $name -Algorithm SHA256).Hash) { throw "Checksum mismatch for $name" }
            Move-Item -LiteralPath $name, "$name.sha256" -Destination $output
          }
          Set-Content -Path (Join-Path $output 'SOURCE_SHA.txt') -Value $head
      - name: Retain verified Windows preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-simple-preview-${{ env.PREVIEW_SOURCE }}
          path: ${{ runner.temp }}/windows-preview
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
