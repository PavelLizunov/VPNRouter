name: Assistant panel verification
run-name: Assistant panel at afd7d26e
on: workflow_dispatch
permissions:
  contents: read
jobs:
  assistant-panel:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: afd7d26e2621798bdae35b55ed973ea6bafcb800
          persist-credentials: false
      - name: Confirm exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = afd7d26e2621798bdae35b55ed973ea6bafcb800
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Exercise and render the assistant panel
        run: dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --filter 'FullyQualifiedName=VPNRouter.Tests.PageScreenshotTests.Assistant_panel_follows_subscription_eligibility' --logger 'console;verbosity=normal'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: assistant-panel-afd7d26e
          path: VPNRouter.Tests/screenshots/assistant-setup-narrow360.png
          if-no-files-found: error
          retention-days: 3
