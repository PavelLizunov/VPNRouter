name: Build and verify the Windows DeepSeek preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-panel:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 38af31e8d7a43048b9439731df6e18389033a1ef
          persist-credentials: false
      - name: Confirm exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = 38af31e8d7a43048b9439731df6e18389033a1ef
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Exercise and render the assistant panel
        run: dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --filter 'FullyQualifiedName=VPNRouter.Tests.PageScreenshotTests.SimplePage_ConnectedWithAssistantAt520x680' --logger 'console;verbosity=normal'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deepseek-harness-window-38af31e8
          path: VPNRouter.Tests/screenshots/simple-connected-with-assistant.png
          if-no-files-found: error
          retention-days: 3
