# Build Windows release ZIPs from the requested immutable tag, submit that exact
# GitHub Actions artifact to SignPath, verify every required Authenticode
# signature on Windows, then upload only to an existing DRAFT release.
#
# Enrollment: plans/code-signing-signpath-runbook-2026-07-10.md

name: Sign Windows (SignPath)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (for example 2.49.1-r1). A draft release and tag vX.Y.Z must already exist.'
        required: true

permissions:
  actions: read
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate enrollment, version and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          ARTIFACT_CONFIG_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          EXPECTED_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SUBJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ] || [ -z "$ORGANIZATION_ID" ] || \
             [ -z "$PROJECT_SLUG" ] || [ -z "$POLICY_SLUG" ] || \
             [ -z "$ARTIFACT_CONFIG_SLUG" ]; then
            echo "::error::All five SignPath secrets are required. Complete enrollment first."
            exit 1
          fi
          if [ -z "$EXPECTED_SUBJECT" ]; then
            echo "::error::Repository variable SIGNPATH_EXPECTED_SUBJECT is required."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          is_draft=$(gh release view "v${VERSION}" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)
          if [ "$is_draft" != "true" ]; then
            echo "::error::v${VERSION} must remain a draft until signed assets and all sidecars are complete."
            exit 1
          fi

  build-sign-and-verify:
    needs: guard
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and AppVersion identity
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 "v$env:VERSION").Trim()
          if ($head -ne $tagCommit) { throw "Tag identity mismatch: HEAD=$head tag=$tagCommit" }
          $source = Get-Content VPNRouter.Core/AppVersion.cs -Raw
          if ($source -notmatch 'string\s+Version\s*=\s*"([^"]+)"') {
            throw 'Could not resolve AppVersion.Version.'
          }
          if ($Matches[1] -ne $env:VERSION) {
            throw "AppVersion/tag mismatch: source=$($Matches[1]) input=$env:VERSION"
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: 1.26.1

      - name: Build Windows ZIPs from source
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./tools/build-singbox-lx.ps1
          ./build.ps1 -Version $env:VERSION `
            -SingBoxPath publish/sing-box-lx.exe -BundleSplitDriver
          $expected = @(
            "VPNRouter-v$env:VERSION-win.zip",
            "VPNRouter-update-v$env:VERSION-win.zip"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Build output missing: $path" }
          }

      - name: Upload source-built unsigned ZIPs
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vpnrouter-windows-source-built
          path: |
            VPNRouter-v${{ inputs.version }}-win.zip
            VPNRouter-update-v${{ inputs.version }}-win.zip
          if-no-files-found: error

      - name: Submit that source-built artifact to SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify every required Authenticode signature
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SUBJECT }}
        run: |
          $full = Join-Path $PWD "signed/VPNRouter-v$env:VERSION-win.zip"
          $update = Join-Path $PWD "signed/VPNRouter-update-v$env:VERSION-win.zip"
          if (-not (Test-Path $full) -or -not (Test-Path $update)) {
            throw 'SignPath output is missing one or both canonical ZIPs.'
          }
          Expand-Archive $full extracted/full -Force
          Expand-Archive $update extracted/update -Force
          $required = @(
            'extracted/full/app/VPNRouter.App.exe',
            'extracted/full/app/VPNRouter.App.dll',
            'extracted/full/app/VPNRouter.GUI.exe',
            'extracted/full/app/VPNRouter.CLI.exe',
            'extracted/full/app/VPNRouter.CLI.dll',
            'extracted/full/app/VPNRouter.Service.exe',
            'extracted/full/app/VPNRouter.Service.dll',
            'extracted/full/app/VPNRouter.Core.dll',
            'extracted/full/app/sing-box.exe',
            'extracted/update/_bootstrap/VPNRouter.App.exe',
            'extracted/update/_bootstrap/VPNRouter.App.dll',
            'extracted/update/VPNRouter.GUI.exe',
            'extracted/update/_bootstrap/VPNRouter.CLI.exe',
            'extracted/update/_bootstrap/VPNRouter.CLI.dll',
            'extracted/update/_bootstrap/VPNRouter.Service.exe',
            'extracted/update/_bootstrap/VPNRouter.Service.dll',
            'extracted/update/_bootstrap/VPNRouter.Core.dll',
            'extracted/update/_bootstrap/sing-box.exe'
          )
          $thumbprint = $null
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Required signed file missing: $path" }
            $signature = Get-AuthenticodeSignature -FilePath $path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature: $path status=$($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate -or
                $signature.SignerCertificate.Subject -notlike "*$env:EXPECTED_SUBJECT*") {
              throw "Unexpected signer: $path subject=$($signature.SignerCertificate.Subject)"
            }
            if ($null -eq $thumbprint) { $thumbprint = $signature.SignerCertificate.Thumbprint }
            elseif ($thumbprint -ne $signature.SignerCertificate.Thumbprint) {
              throw "Signer certificate mismatch: $path"
            }
          }

      - name: Upload verified signed ZIPs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vpnrouter-windows-verified-signed
          path: signed/*.zip
          if-no-files-found: error

  stage-draft-assets:
    needs: build-sign-and-verify
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified signed ZIPs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vpnrouter-windows-verified-signed
          path: signed

      - name: Recheck draft, create sidecars and stage signed assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $isDraft = gh release view "v$env:VERSION" --repo "${{ github.repository }}" --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'true') {
            throw "Release v$env:VERSION is no longer a draft; refusing any mutation."
          }
          Push-Location signed
          try {
            $zips = @(
              "VPNRouter-v$env:VERSION-win.zip",
              "VPNRouter-update-v$env:VERSION-win.zip"
            )
            foreach ($zip in $zips) {
              (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() |
                Set-Content -Encoding ascii -NoNewline "$zip.sha256"
            }
            $assets = @(
              $zips[0], "$($zips[0]).sha256",
              $zips[1], "$($zips[1]).sha256"
            )
            & gh release upload "v$env:VERSION" @assets --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }
          }
          finally { Pop-Location }

      - name: Summary
        shell: pwsh
        run: |
          "Signed Windows assets are verified and staged on draft v${{ inputs.version }}. The release remains draft until the full 16-asset and post-ship gates pass." | Write-Host
