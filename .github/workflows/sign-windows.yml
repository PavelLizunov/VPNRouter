# Sign the Windows release ZIPs with SignPath.io (Foundation / OSS, free).
#
# WHY: the Windows binaries (App/CLI/Service/GUI + sing-box-lx.exe) ship UNSIGNED,
# which is the root cause of the "disappears after a reboot" reports — an AV can
# quarantine unsigned binaries that do TUN / process-scan / firewall work. Signing
# is the real fix (OPEN-DEFECTS P1 "deleted after reboot" / dep-review; research
# in plans/research-seamless-update-findings-2026-07-09.md §4).
#
# STATUS: INERT until enrollment. This workflow is MANUAL-ONLY (workflow_dispatch)
# and its first step fails fast until the SignPath secrets exist, so it is never a
# silent no-op nor an accidental auto-run. Turnkey enrollment steps:
# plans/code-signing-signpath-runbook-2026-07-10.md.
#
# REQUIRED repo secrets (Settings -> Secrets and variables -> Actions), all from
# the SignPath project once approved:
#   SIGNPATH_API_TOKEN                  - CI user API token
#   SIGNPATH_ORGANIZATION_ID            - org GUID
#   SIGNPATH_PROJECT_SLUG               - e.g. "vpnrouter"
#   SIGNPATH_SIGNING_POLICY_SLUG        - e.g. "release-signing"
#   SIGNPATH_ARTIFACT_CONFIG_SLUG       - artifact config that signs the PEs inside the ZIP set
#
# Run AFTER build.ps1 has published the -rN / stable release (the same manual
# spot in the ship flow where sign-android runs), then re-run the live-update gate.

name: Sign Windows (SignPath)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version WITHOUT leading v (e.g. 2.47.0 or 2.47.0-r6). The release vX.Y.Z must already hold the unsigned VPNRouter-vX.Y.Z-win.zip.'
        required: true

permissions:
  contents: write   # re-upload the signed assets to the release

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - secrets present
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SignPath secrets are not configured yet. Complete enrollment first — see plans/code-signing-signpath-runbook-2026-07-10.md."
            exit 1
          fi

      - name: Download the unsigned Windows ZIPs from the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p unsigned
          gh release download "v${VERSION}" --repo "${{ github.repository }}" \
            --pattern "VPNRouter-v${VERSION}-win.zip" \
            --pattern "VPNRouter-update-v${VERSION}-win.zip" \
            --dir unsigned
          ls -la unsigned

      # SignPath signs the artifact that was uploaded as a GitHub workflow artifact
      # (identified by github-artifact-id) per the artifact configuration, and
      # returns the signed result into output-artifact-directory. Upload both ZIPs
      # as one artifact so a single request signs the whole set.
      - name: Upload unsigned ZIPs as a workflow artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: vpnrouter-windows-unsigned
          path: unsigned/*.zip

      - name: Submit to SignPath (waits for your approval in the SignPath UI)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Recompute sha256 sidecars + re-upload signed ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          cd signed
          for z in VPNRouter-v${VERSION}-win.zip VPNRouter-update-v${VERSION}-win.zip; do
            test -f "$z" || { echo "::error::signed $z missing — check the SignPath artifact configuration includes both ZIPs"; exit 1; }
            sha256sum "$z" | awk '{print $1}' > "${z}.sha256"
          done
          # --clobber replaces the unsigned assets in place (same tagged URLs).
          gh release upload "v${VERSION}" \
            "VPNRouter-v${VERSION}-win.zip" "VPNRouter-v${VERSION}-win.zip.sha256" \
            "VPNRouter-update-v${VERSION}-win.zip" "VPNRouter-update-v${VERSION}-win.zip.sha256" \
            --repo "${{ github.repository }}" --clobber
          echo "Signed Windows ZIPs re-uploaded. Verify Authenticode on the EXEs inside, then re-run the live-update gate."
