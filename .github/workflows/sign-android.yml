name: Sign Android APK

# Retired: preuploaded APKs cannot establish source provenance. Keep an explicit
# failing entry point so old operator commands cannot silently sign arbitrary bytes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Retired; use Build Android APK at the immutable version tag.'
        required: true
      key_alias:
        description: 'Legacy compatibility input; ignored.'
        required: false
        default: 'vpnrouter'

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy signing
        run: |
          echo '::error::Legacy APK signing is disabled. Run build-android.yml with --ref vVERSION and version=VERSION; it builds and signs exact-tag ARM64 artifacts on a draft.'
          exit 1
