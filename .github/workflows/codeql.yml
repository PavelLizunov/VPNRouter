name: CodeQL


on:
  schedule:
    - cron: '23 4 * * 1'   # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with:
          languages: csharp

      - name: Build
        run: |
          dotnet restore VPNRouter.Tests/VPNRouter.Tests.csproj
          dotnet build VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with:
          category: "/language:csharp"
