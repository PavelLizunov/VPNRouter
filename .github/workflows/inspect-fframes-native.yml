name: Inspect cached fframes native provenance

on:
  push:
    branches: ['dsh/fframes-eight-styles']
    paths:
      - '.github/workflows/inspect-fframes-native.yml'
      - '.github/native-provenance/**'

permissions:
  contents: read

concurrency:
  group: fframes-native-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/help-videos/fframes-vpnrouter
    steps:
      - name: Checkout exact failed-baseline source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ac5ac03c4475c32dea13738e5941db00115c8da6
          persist-credentials: false
      - name: Checkout exact collector implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: collector-code
          persist-credentials: false
      - name: Check collector contracts without native execution
        run: PYTHONDONTWRITEBYTECODE=1 python3 "$GITHUB_WORKSPACE/collector-code/.github/native-provenance/test_collect.py"
      - name: Record read-only resource and tool preflight
        run: |
          set -euo pipefail
          mkdir -p out/native-provenance
          {
            date -u
            git rev-parse HEAD
            hostname
            uname -a
            nproc
            uptime
            free -m
            df -m .
            ps -eo pid,comm,pcpu,pmem --sort=-pcpu | head -20 || true
            rustc --version
            cargo --version
            command -v readelf
          } | tee out/native-provenance/preflight.txt
          test "$(git rev-parse HEAD)" = ac5ac03c4475c32dea13738e5941db00115c8da6
          python3 - <<'PY'
          import os, shutil
          available = int(next(line.split()[1] for line in open('/proc/meminfo') if line.startswith('MemAvailable:'))) * 1024
          assert available > 3 * 1024**3, 'Less than 3 GiB RAM available'
          assert shutil.disk_usage('.').free > 8 * 1024**3, 'Less than 8 GiB disk free'
          assert os.getloadavg()[0] < os.cpu_count() * 2, 'Runner is overloaded'
          PY
      - name: Install disposable package headers without building
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx264-dev binutils
      - name: Restore existing renderer cache without saving
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/help-videos/fframes-vpnrouter/target
          key: fframes-film-${{ runner.os }}-ubuntu24-source-v2-${{ hashFiles('tools/help-videos/fframes-vpnrouter/Cargo.toml', 'tools/help-videos/fframes-vpnrouter/Cargo.lock') }}
          fail-on-cache-miss: true
      - name: Collect allowlisted native provenance only
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/collector-code/.github/native-provenance/collect.py" \
            --repo "$PWD" --registry "$HOME/.cargo/registry/src" \
            --output out/native-provenance/collected
      - name: Upload provenance evidence even on missing cache
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vpnrouter-native-provenance-${{ github.run_id }}
          path: tools/help-videos/fframes-vpnrouter/out/native-provenance/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
