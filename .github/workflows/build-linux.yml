name: Build Linux AppImage + .deb

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without 'v' prefix, e.g. 2.21.1)"
        required: true
        type: string
      upload_to_release:
        description: "Upload built AppImage + .deb to the matching GitHub release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # needed to upload release assets

jobs:
  build:
    runs-on: ubuntu-22.04  # pin to 22.04 for glibc compatibility with older distros

    steps:
      - name: Validate requested version and dispatch ref
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-r[1-9][0-9]*)?$ ]]; then
            echo "::error::Expected X.Y.Z or X.Y.Z-rN (N >= 1)."
            exit 1
          fi
          TAG="v$VERSION"
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::Run workflow_dispatch with --ref $TAG; branch refs and mismatched tags are forbidden."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify requested tag and full AppVersion
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          TAG_SHA=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$TAG_SHA" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Requested tag does not point to the exact workflow commit."
            exit 1
          fi
          APPVER=$(sed -nE 's/^[[:space:]]*public static readonly string Version = "([^"]+)";.*/\1/p' VPNRouter.Core/AppVersion.cs)
          if [ "$APPVER" != "$VERSION" ]; then
            echo "::error::AppVersion/tag mismatch; full version including -rN must match."
            exit 1
          fi

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: dotnet publish (linux-x64, self-contained)
        run: |
          dotnet publish VPNRouter.App/VPNRouter.App.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o publish/linux-x64

      - name: Bundle sing-box-vpnctl-linux-amd64 + libcronet
        run: |
          set -euo pipefail
          SINGBOX_VPNCTL_VER="1.14.2-vpnctl.2"
          SINGBOX_VPNCTL_SHA256="095a575fb412e5520b5c16449002073a5ba587646b96e3dddd2c59473d5be2d8"
          curl -sSL -o /tmp/singbox-vpnctl.tar.gz \
            "https://github.com/PavelLizunov/sing-box-vpnctl/releases/download/v${SINGBOX_VPNCTL_VER}/sing-box-${SINGBOX_VPNCTL_VER}-linux-amd64.tar.gz"
          echo "${SINGBOX_VPNCTL_SHA256}  /tmp/singbox-vpnctl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/singbox-vpnctl.tar.gz -C /tmp
          cp "/tmp/sing-box-${SINGBOX_VPNCTL_VER}-linux-amd64/sing-box" publish/linux-x64/sing-box
          chmod +x publish/linux-x64/sing-box

          SINGBOX_VER="1.14.2"
          SINGBOX_SHA256="a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"
          curl -sSL -o /tmp/singbox.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          echo "${SINGBOX_SHA256}  /tmp/singbox.tar.gz" | sha256sum -c -
          tar -xzf /tmp/singbox.tar.gz -C /tmp
          cp "/tmp/sing-box-${SINGBOX_VER}-linux-amd64/libcronet.so" publish/linux-x64/libcronet.so
          ls -lh publish/linux-x64/sing-box publish/linux-x64/libcronet.so

          publish/linux-x64/sing-box version
          publish/linux-x64/sing-box version | grep -q with_awg

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          APPDIR="VPNRouter.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp -R publish/linux-x64/. "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/VPNRouter.App" || true

          cp VPNRouter.App/Assets/penguin_mascot_tile.png "$APPDIR/vpnrouter.png"
          cp VPNRouter.App/Assets/penguin_mascot_tile.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/vpnrouter.png"

          cp packaging/linux/vpnrouter.desktop "$APPDIR/vpnrouter.desktop"
          cp packaging/linux/vpnrouter.desktop "$APPDIR/usr/share/applications/vpnrouter.desktop"
          sed -i 's|^Exec=.*|Exec=VPNRouter.App|' "$APPDIR/vpnrouter.desktop"
          sed -i 's|^Exec=.*|Exec=VPNRouter.App|' "$APPDIR/usr/share/applications/vpnrouter.desktop"

          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/VPNRouter.App" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          echo "AppDir laid out:"
          find "$APPDIR" -maxdepth 2 -type f | head -20

      - name: Build AppImage
        run: |
          set -euo pipefail
          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          APPIMAGETOOL_SIZE=15092216
          wget -q -O appimagetool "$APPIMAGETOOL_URL"
          [ "$(stat -c %s appimagetool)" = "$APPIMAGETOOL_SIZE" ]
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            VPNRouter.AppDir \
            "VPNRouter-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
          ls -lh "VPNRouter-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

      - name: Build .deb
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          PKG="vpnrouter_${VER}_amd64"
          mkdir -p "$PKG/DEBIAN"
          mkdir -p "$PKG/opt/vpnrouter"
          mkdir -p "$PKG/usr/bin"
          mkdir -p "$PKG/usr/share/applications"
          mkdir -p "$PKG/usr/share/icons/hicolor/256x256/apps"

          cp -R publish/linux-x64/. "$PKG/opt/vpnrouter/"
          chmod +x "$PKG/opt/vpnrouter/VPNRouter.App" || true

          cat > "$PKG/usr/bin/vpnrouter" <<'WRAP'
          #!/usr/bin/env bash
          exec /opt/vpnrouter/VPNRouter.App "$@"
          WRAP
          chmod +x "$PKG/usr/bin/vpnrouter"

          mkdir -p "$PKG/usr/libexec"
          mkdir -p "$PKG/usr/share/polkit-1/actions"
          sed 's/\r$//' packaging/linux/vpnrouter-update-helper > "$PKG/usr/libexec/vpnrouter-update-helper"
          sed 's/\r$//' packaging/linux/com.vpnrouter.update.policy > "$PKG/usr/share/polkit-1/actions/com.vpnrouter.update.policy"
          chmod 755 "$PKG/usr/libexec/vpnrouter-update-helper"
          chmod 644 "$PKG/usr/share/polkit-1/actions/com.vpnrouter.update.policy"

          sed 's/\r$//' packaging/linux/postinst > "$PKG/DEBIAN/postinst"
          sed 's/\r$//' packaging/linux/postrm   > "$PKG/DEBIAN/postrm"
          chmod 755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/postrm"

          cp packaging/linux/vpnrouter.desktop "$PKG/usr/share/applications/vpnrouter.desktop"
          sed -i 's|^Exec=.*|Exec=/usr/bin/vpnrouter|' "$PKG/usr/share/applications/vpnrouter.desktop"
          cp VPNRouter.App/Assets/penguin_mascot_tile.png "$PKG/usr/share/icons/hicolor/256x256/apps/vpnrouter.png"

          SIZE_KB=$(du -sk "$PKG" | cut -f1)
          cat > "$PKG/DEBIAN/control" <<CTRL
          Package: vpnrouter
          Version: ${VER}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libx11-6, libice6, libsm6, libfontconfig1, libicu70 | libicu71 | libicu72 | libicu74 | libicu76 | libicu78, policykit-1 | polkitd, nftables
          Recommends: libayatana-appindicator3-1
          Maintainer: NiniTux <noreply@example.invalid>
          Installed-Size: ${SIZE_KB}
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Description: Virtual Penguin Network — process-based split-tunnel VPN
           Routes selected applications through a VLESS+Reality proxy via sing-box
           TUN mode; everything else goes direct. Includes free-config aggregator,
           deep-verify, and multiple subscriptions.
          CTRL

          dpkg-deb --build --root-owner-group "$PKG"
          mv "${PKG}.deb" "VPNRouter-v${VER}-linux-amd64.deb"
          ls -lh "VPNRouter-v${VER}-linux-amd64.deb"

      - name: Build tar.gz
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          STAGE="stage/VPNRouter"
          mkdir -p "$STAGE"
          cp -R publish/linux-x64/. "$STAGE/"
          cp packaging/linux/VPNRouter.sh "$STAGE/VPNRouter.sh"
          cp packaging/linux/vpnrouter.desktop "$STAGE/vpnrouter.desktop"
          cp VPNRouter.App/Assets/penguin_mascot_tile.png "$STAGE/icon.png"
          sed -e "s|{VERSION}|${VER}|g" -e "s|{REPO}|${GITHUB_REPOSITORY}|g" \
              packaging/linux/README.txt > "$STAGE/README.txt"
          chmod +x "$STAGE/VPNRouter.sh" "$STAGE/VPNRouter.App" || true
          ( cd stage && tar -czf "../VPNRouter-v${VER}-linux.tar.gz" VPNRouter )
          ls -lh "VPNRouter-v${VER}-linux.tar.gz"

      - name: Compute SHA256 checksums
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          for f in \
            "VPNRouter-v${VER}-linux-x86_64.AppImage" \
            "VPNRouter-v${VER}-linux-amd64.deb" \
            "VPNRouter-v${VER}-linux.tar.gz"; do
            sha256sum "$f" | awk '{print $1"  "$2}' > "${f}.sha256"
            echo "→ $(cat "${f}.sha256")"
          done

      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-build-v${{ steps.version.outputs.version }}
          path: |
            VPNRouter-v*-linux-x86_64.AppImage
            VPNRouter-v*-linux-x86_64.AppImage.sha256
            VPNRouter-v*-linux-amd64.deb
            VPNRouter-v*-linux-amd64.deb.sha256
            VPNRouter-v*-linux.tar.gz
            VPNRouter-v*-linux.tar.gz.sha256
          retention-days: 30

      - name: Upload to GitHub Release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VER="${{ steps.version.outputs.version }}"

          git fetch --no-tags origin "refs/tags/$TAG"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]; then
            echo "::error::Remote tag changed since this workflow started."
            exit 1
          fi
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release must already exist and remain a draft; refusing upload."
            exit 1
          fi

          echo "Uploading to release $TAG..."
          gh release upload "$TAG" \
            "VPNRouter-v${VER}-linux-x86_64.AppImage" \
            "VPNRouter-v${VER}-linux-x86_64.AppImage.sha256" \
            "VPNRouter-v${VER}-linux-amd64.deb" \
            "VPNRouter-v${VER}-linux-amd64.deb.sha256" \
            "VPNRouter-v${VER}-linux.tar.gz" \
            "VPNRouter-v${VER}-linux.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY"
          echo "✓ Uploaded AppImage + .deb + tar.gz to $TAG"
