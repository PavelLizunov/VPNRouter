name: Build Linux AppImage + .deb

# Triggered by:
#  - pushing a v* tag (automatic on release)
#  - manual dispatch (re-run on existing releases for missing assets)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without 'v' prefix, e.g. 2.21.1)"
        required: true
        type: string
      upload_to_release:
        description: "Upload built AppImage + .deb to the matching GitHub release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # needed to upload release assets

jobs:
  build:
    runs-on: ubuntu-22.04  # pin to 22.04 for glibc compatibility with older distros

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      # v2.45.x: the Linux bundle now ships the sing-box-lx FORK (with_awg +
      # with_xhttp) built via tools/build-singbox-lx.sh, which needs Go >=1.24.7.
      - name: Setup Go (for sing-box-lx fork build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.25"

      # Phase 1 Q9 — NuGet package cache. `dotnet publish` restores packages
      # from nuget.org on cold runs (~30–60 s). Caching ~/.nuget/packages
      # keyed on the union hash of every .csproj keeps the cache fresh
      # without manual invalidation. Q11 will pin actions/cache to a SHA.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Resolve version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # ── .NET publish ────────────────────────────────────────────────────
      # Self-contained so end users don't need dotnet installed.
      # --runtime linux-x64 handles ~99 % of desktop Linux (x86_64 Intel/AMD).
      # ARM64 (Raspberry Pi, Asahi Linux) would need a second job; deferred.
      - name: dotnet publish (linux-x64, self-contained)
        # Only VPNRouter.App. VPNRouter.CLI and VPNRouter.Service target
        # net8.0-windows specifically — CLI pulls Service which in turn
        # uses ETW (Microsoft.Diagnostics.Tracing.TraceEvent) that's
        # guarded by #if PLATFORM_WINDOWS in VPNRouter.Core. Building CLI
        # on linux-x64 breaks because the ETW symbols aren't compiled
        # in, Service can't find them, and the chain fails. Desktop
        # Linux only needs the Avalonia app anyway; CLI / service
        # management on Linux is a v2.22+ story (systemd user unit).
        run: |
          dotnet publish VPNRouter.App/VPNRouter.App.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o publish/linux-x64

      # Bundle sing-box next to VPNRouter.App so the first-run Deploy step (in
      # MainWindowViewModel.cs) can copy it into ~/.config/vpnrouter/bin/ + chmod +x.
      #
      # v2.45.x: switched from upstream sing-box to the sing-box-lx FORK (with_awg +
      # with_xhttp) so AmneziaWG + XHTTP work on Linux too — SAME fork / pinned commits
      # / patches as Windows (tools/build-singbox-lx.ps1), built natively for
      # linux-amd64 via tools/build-singbox-lx.sh. SingBoxFeatures tag-probes the binary,
      # so AWG/XHTTP auto-enable once the core carries the tags (no app-code platform
      # gate). Trade-off vs the old "upstream eliminates custom-build as a variable":
      # Linux now rides the fork (1.13.13-base) exactly as Windows already does — the
      # AWG/XHTTP support the app needs isn't in upstream. libcronet.so is NOT built by
      # the fork, so it's still fetched from the upstream archive (NaiveProxy dlopen's it).
      - name: Bundle sing-box-lx-linux-amd64 (fork with_awg + with_xhttp) + libcronet
        run: |
          set -euo pipefail
          bash tools/build-singbox-lx.sh "${{ steps.version.outputs.version }}" publish/linux-x64/sing-box
          chmod +x publish/linux-x64/sing-box
          # libcronet.so — still from upstream (fork doesn't build it; NaiveProxy
          # dlopen's it at runtime). The deb/AppImage/tar.gz all `cp -R publish/linux-x64/.`,
          # so it rides into every Linux artifact automatically.
          SINGBOX_VER="1.13.14"
          SINGBOX_SHA256="f48703461a15476951ac4967cdad339d986f4b8096b4eb3ff0829a500502d697"
          curl -sSL -o /tmp/singbox.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          echo "${SINGBOX_SHA256}  /tmp/singbox.tar.gz" | sha256sum -c -
          tar -xzf /tmp/singbox.tar.gz -C /tmp
          cp "/tmp/sing-box-${SINGBOX_VER}-linux-amd64/libcronet.so" publish/linux-x64/libcronet.so
          ls -lh publish/linux-x64/sing-box publish/linux-x64/libcronet.so
          # Sanity: build-singbox-lx.sh already asserts with_awg+with_xhttp via
          # `go version -m`, but re-check the installed copy runs + carries with_awg
          # (a feature-less core would ship green then FATAL every AWG config).
          publish/linux-x64/sing-box version
          publish/linux-x64/sing-box version | grep -q with_awg

      # ── AppImage ────────────────────────────────────────────────────────
      # AppImage layout:
      #   VPNRouter.AppDir/
      #     AppRun                      (entrypoint script chosen by AppImage runtime)
      #     vpnrouter.desktop           (menu metadata, required at root)
      #     vpnrouter.png               (icon, required at root, must match .desktop Icon=)
      #     usr/bin/VPNRouter.App       (the actual binary)
      #     usr/bin/*.dll, *.so         (runtime deps)
      #     usr/share/icons/.../vpnrouter.png  (conventional icon location)
      - name: Assemble AppDir
        run: |
          set -euo pipefail
          APPDIR="VPNRouter.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Payload
          cp -R publish/linux-x64/. "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/VPNRouter.App" || true

          # Icon
          cp VPNRouter.App/Assets/penguin_mascot_tile.png "$APPDIR/vpnrouter.png"
          cp VPNRouter.App/Assets/penguin_mascot_tile.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/vpnrouter.png"

          # .desktop
          cp packaging/linux/vpnrouter.desktop "$APPDIR/vpnrouter.desktop"
          cp packaging/linux/vpnrouter.desktop "$APPDIR/usr/share/applications/vpnrouter.desktop"
          # AppImage convention: Exec= must point to the real binary name
          # inside usr/bin/, not the launcher shim.
          sed -i 's|^Exec=.*|Exec=VPNRouter.App|' "$APPDIR/vpnrouter.desktop"
          sed -i 's|^Exec=.*|Exec=VPNRouter.App|' "$APPDIR/usr/share/applications/vpnrouter.desktop"

          # AppRun — AppImage entrypoint. Sets LD_LIBRARY_PATH so the bundled
          # Avalonia native libs (libHarfBuzzSharp, libSkiaSharp) are picked
          # over any stale system copies, then execs the real binary.
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/VPNRouter.App" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          echo "AppDir laid out:"
          find "$APPDIR" -maxdepth 2 -type f | head -20

      - name: Build AppImage
        run: |
          set -euo pipefail
          # appimagetool is a single-file ELF. Pin the IMMUTABLE release asset
          # (repo AppImage/appimagetool, tag 1.9.1, asset appimagetool-x86_64.AppImage).
          # The old retired AppImageKit rolling ref changed on every upstream CI
          # build — a supply-chain RCE vector; never reintroduce a rolling ref.
          # To update: bump the tag in APPIMAGETOOL_URL to the next immutable
          # release, re-read the asset size via
          # `gh api repos/AppImage/appimagetool/releases/tags/<tag>` into
          # APPIMAGETOOL_SIZE, and re-capture the SHA256 from the official release
          # asset (one-time CI/owner download over github TLS) into APPIMAGETOOL_SHA256.
          # Fail-closed: any size/digest mismatch aborts the build before chmod/exec.
          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          APPIMAGETOOL_SIZE=15092216
          wget -q -O appimagetool "$APPIMAGETOOL_URL"
          [ "$(stat -c %s appimagetool)" = "$APPIMAGETOOL_SIZE" ]
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          # --appimage-extract-and-run avoids needing FUSE on the runner.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            VPNRouter.AppDir \
            "VPNRouter-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
          ls -lh "VPNRouter-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

      # ── .deb (Debian/Ubuntu/Mint) ──────────────────────────────────────
      # Classic dpkg-deb layout. Installs to /opt/vpnrouter with /usr/bin/
      # wrapper + .desktop launcher for menu integration.
      - name: Build .deb
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          PKG="vpnrouter_${VER}_amd64"
          mkdir -p "$PKG/DEBIAN"
          mkdir -p "$PKG/opt/vpnrouter"
          mkdir -p "$PKG/usr/bin"
          mkdir -p "$PKG/usr/share/applications"
          mkdir -p "$PKG/usr/share/icons/hicolor/256x256/apps"

          # Payload → /opt/vpnrouter
          cp -R publish/linux-x64/. "$PKG/opt/vpnrouter/"
          chmod +x "$PKG/opt/vpnrouter/VPNRouter.App" || true

          # Wrapper on PATH
          cat > "$PKG/usr/bin/vpnrouter" <<'WRAP'
          #!/usr/bin/env bash
          exec /opt/vpnrouter/VPNRouter.App "$@"
          WRAP
          chmod +x "$PKG/usr/bin/vpnrouter"

          # v2.22.2-r8: polkit-based passwordless update.
          # The helper script does the privileged cp+chmod+pkill in one
          # atomic unit. The .policy file references the helper's path
          # and grants allow_active=yes so local users don't get a
          # password prompt. Without the annotate exec.path, allow_active
          # would be ignored.
          mkdir -p "$PKG/usr/libexec"
          mkdir -p "$PKG/usr/share/polkit-1/actions"
          # Defensive CRLF strip — .gitattributes handles this for fresh
          # clones, but an old working copy committed before the attrs
          # change could still carry CR bytes.
          sed 's/\r$//' packaging/linux/vpnrouter-update-helper > "$PKG/usr/libexec/vpnrouter-update-helper"
          sed 's/\r$//' packaging/linux/com.vpnrouter.update.policy > "$PKG/usr/share/polkit-1/actions/com.vpnrouter.update.policy"
          chmod 755 "$PKG/usr/libexec/vpnrouter-update-helper"
          chmod 644 "$PKG/usr/share/polkit-1/actions/com.vpnrouter.update.policy"

          # v2.28.0: passwordless VPN start via POSIX capabilities.
          # postinst runs `setcap cap_net_admin,cap_net_bind_service=+eip`
          # on the bundled sing-box so the app can spawn it as a normal
          # user, no pkexec / password prompts. postrm cleans up running
          # processes on uninstall. Both must be mode 0755 inside the
          # .deb or dpkg refuses to execute them.
          sed 's/\r$//' packaging/linux/postinst > "$PKG/DEBIAN/postinst"
          sed 's/\r$//' packaging/linux/postrm   > "$PKG/DEBIAN/postrm"
          chmod 755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/postrm"

          # .desktop + icon
          cp packaging/linux/vpnrouter.desktop "$PKG/usr/share/applications/vpnrouter.desktop"
          sed -i 's|^Exec=.*|Exec=/usr/bin/vpnrouter|' "$PKG/usr/share/applications/vpnrouter.desktop"
          cp VPNRouter.App/Assets/penguin_mascot_tile.png "$PKG/usr/share/icons/hicolor/256x256/apps/vpnrouter.png"

          # control metadata
          SIZE_KB=$(du -sk "$PKG" | cut -f1)
          cat > "$PKG/DEBIAN/control" <<CTRL
          Package: vpnrouter
          Version: ${VER}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libx11-6, libice6, libsm6, libfontconfig1, libicu70 | libicu71 | libicu72 | libicu74, policykit-1 | polkitd, nftables
          Recommends: libayatana-appindicator3-1
          Maintainer: NiniTux <noreply@example.invalid>
          Installed-Size: ${SIZE_KB}
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Description: Virtual Penguin Network — process-based split-tunnel VPN
           Routes selected applications through a VLESS+Reality proxy via sing-box
           TUN mode; everything else goes direct. Includes free-config aggregator,
           deep-verify, and multiple subscriptions.
          CTRL

          # Build .deb
          dpkg-deb --build --root-owner-group "$PKG"
          mv "${PKG}.deb" "VPNRouter-v${VER}-linux-amd64.deb"
          ls -lh "VPNRouter-v${VER}-linux-amd64.deb"

      # ── tar.gz (unchanged, for advanced users / non-Debian distros) ──
      - name: Build tar.gz
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          STAGE="stage/VPNRouter"
          mkdir -p "$STAGE"
          cp -R publish/linux-x64/. "$STAGE/"
          cp packaging/linux/VPNRouter.sh "$STAGE/VPNRouter.sh"
          cp packaging/linux/vpnrouter.desktop "$STAGE/vpnrouter.desktop"
          cp VPNRouter.App/Assets/penguin_mascot_tile.png "$STAGE/icon.png"
          sed -e "s|{VERSION}|${VER}|g" -e "s|{REPO}|${GITHUB_REPOSITORY}|g" \
              packaging/linux/README.txt > "$STAGE/README.txt"
          chmod +x "$STAGE/VPNRouter.sh" "$STAGE/VPNRouter.App" || true
          ( cd stage && tar -czf "../VPNRouter-v${VER}-linux.tar.gz" VPNRouter )
          ls -lh "VPNRouter-v${VER}-linux.tar.gz"

      # ── sha256 sidecars ────────────────────────────────────────────────
      - name: Compute SHA256 checksums
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          for f in \
            "VPNRouter-v${VER}-linux-x86_64.AppImage" \
            "VPNRouter-v${VER}-linux-amd64.deb" \
            "VPNRouter-v${VER}-linux.tar.gz"; do
            sha256sum "$f" | awk '{print $1"  "$2}' > "${f}.sha256"
            echo "→ $(cat "${f}.sha256")"
          done

      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-build-v${{ steps.version.outputs.version }}
          path: |
            VPNRouter-v*-linux-x86_64.AppImage
            VPNRouter-v*-linux-x86_64.AppImage.sha256
            VPNRouter-v*-linux-amd64.deb
            VPNRouter-v*-linux-amd64.deb.sha256
            VPNRouter-v*-linux.tar.gz
            VPNRouter-v*-linux.tar.gz.sha256
          retention-days: 30

      - name: Upload to GitHub Release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VER="${{ steps.version.outputs.version }}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::Release $TAG does not exist yet — skipping upload. Create the release first, then re-run this workflow."
            exit 0
          fi

          echo "Uploading to release $TAG..."
          gh release upload "$TAG" \
            "VPNRouter-v${VER}-linux-x86_64.AppImage" \
            "VPNRouter-v${VER}-linux-x86_64.AppImage.sha256" \
            "VPNRouter-v${VER}-linux-amd64.deb" \
            "VPNRouter-v${VER}-linux-amd64.deb.sha256" \
            "VPNRouter-v${VER}-linux.tar.gz" \
            "VPNRouter-v${VER}-linux.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "✓ Uploaded AppImage + .deb + tar.gz to $TAG"
