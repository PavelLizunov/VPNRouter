name: Observe bounded fframes importer

on:
  push:
    branches: ['dsh/fframes-eight-styles']
    paths:
      - '.github/workflows/observe-fframes-importer.yml'
      - '.github/importer-observation/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: fframes-importer-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  importer-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      FFRAMES_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact frozen film source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ac5ac03c4475c32dea13738e5941db00115c8da6
          persist-credentials: false
      - name: Checkout exact isolated diagnostic implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: observation-code
          persist-credentials: false
      - name: Run source and negative-control contracts only
        run: python3 -m unittest discover -s observation-code/.github/importer-observation -p 'test_*.py' -v
      - name: Record preflight and retain hash-bound historical operands
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 observation-code/.github/importer-observation/ci.py prepare \
            --root "$GITHUB_WORKSPACE/tools/help-videos/fframes-vpnrouter" \
            --output "$GITHUB_WORKSPACE/importer-evidence" --work "$RUNNER_TEMP/importer-work"
      - name: Install disposable native prerequisites only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config clang libclang-dev nasm yasm \
            ninja-build ffmpeg libx264-dev libx265-dev libopus-dev libvpx-dev libasound2-dev libssl-dev
      - name: Build isolated plain and instrumented libraries and fixed adapter
        run: |
          python3 observation-code/.github/importer-observation/ci.py build \
            --root "$GITHUB_WORKSPACE/tools/help-videos/fframes-vpnrouter" \
            --output "$GITHUB_WORKSPACE/importer-evidence" --work "$RUNNER_TEMP/importer-work"
      - name: Verify transparency then observe only the selected lifetime
        run: |
          python3 observation-code/.github/importer-observation/ci.py experiment \
            --root "$GITHUB_WORKSPACE/tools/help-videos/fframes-vpnrouter" \
            --output "$GITHUB_WORKSPACE/importer-evidence" --work "$RUNNER_TEMP/importer-work"
      - name: Upload all diagnostic operands even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vpnrouter-importer-observation-${{ github.run_id }}
          path: importer-evidence/
          retention-days: 30
          if-no-files-found: error
