name: Verify Release Integrity

# Final gate: explicitly verify a completed draft before publishing, then check
# published releases again. Asset uploads are not a completion signal.
# Dispatch MUST select the requested tag as the workflow ref, for example:
# gh workflow run verify-release-integrity.yml --ref "$TAG" -f tag="$TAG" -f auto_draft_on_failure=false
# The remote tag commit must equal github.sha; old tags without this workflow
# cannot acquire trustworthy verification by dispatching code from another ref.
# All 16 assets and paired hashes are mandatory before any archive is inspected.
# Windows embedded AppVersion is a hard check. Other platforms remain soft
# because AOT/assembly compression can remove the literal. AppImage embedded
# version inspection is deliberately unavailable: never execute release payloads.
# Sidecars establish consistency, not publisher authenticity or reproducibility.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z[-rN] release tag; also select this tag as the workflow ref."
        required: true
        type: string
      auto_draft_on_failure:
        description: "Draft and flag corrupt releases (false disables ALL release mutations)."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_TAG: ${{ inputs.tag }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      REF_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
      WORKFLOW_SHA: ${{ github.sha }}
      AUTO_DRAFT_INPUT: ${{ inputs.auto_draft_on_failure }}

    steps:
      - name: Resolve tag and version
        id: tag
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-r[1-9][0-9]*)?$ ]]; then
            echo "::error::Expected strict vX.Y.Z[-rN] release tag"
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$TAG" ]; then
            echo '::error::Run this workflow with --ref set to the requested release tag'
            exit 1
          fi
          # The commits endpoint peels both annotated and lightweight tags.
          REMOTE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
          if [ "$REMOTE_SHA" != "$WORKFLOW_SHA" ]; then
            echo "::error::Remote release tag does not match the workflow commit"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends p7zip-full zstd

      - name: Require exact inventory and download release assets
        env:
          EXPECTED_TAG: ${{ steps.tag.outputs.tag }}
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          EXPECTED_FILES=(
            "VPNRouter-v${EXPECTED_VERSION}-win.zip"
            "VPNRouter-v${EXPECTED_VERSION}-win.zip.sha256"
            "VPNRouter-update-v${EXPECTED_VERSION}-win.zip"
            "VPNRouter-update-v${EXPECTED_VERSION}-win.zip.sha256"
            "VPNRouter-v${EXPECTED_VERSION}-mac.dmg"
            "VPNRouter-v${EXPECTED_VERSION}-mac.dmg.sha256"
            "VPNRouter-v${EXPECTED_VERSION}-mac.zip"
            "VPNRouter-v${EXPECTED_VERSION}-mac.zip.sha256"
            "VPNRouter-v${EXPECTED_VERSION}-linux-amd64.deb"
            "VPNRouter-v${EXPECTED_VERSION}-linux-amd64.deb.sha256"
            "VPNRouter-v${EXPECTED_VERSION}-linux-x86_64.AppImage"
            "VPNRouter-v${EXPECTED_VERSION}-linux-x86_64.AppImage.sha256"
            "VPNRouter-v${EXPECTED_VERSION}-linux.tar.gz"
            "VPNRouter-v${EXPECTED_VERSION}-linux.tar.gz.sha256"
            "VPNRouter-v${EXPECTED_VERSION}-android-arm64.apk"
            "VPNRouter-v${EXPECTED_VERSION}-android-arm64.apk.sha256"
          )
          printf '%s\n' "${EXPECTED_FILES[@]}" | LC_ALL=C sort > expected-assets.txt
          # Compare ALL names, not only VPNRouter-*; duplicate names also fail.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_TAG" > release-before.json
          jq -e '.id > 0 and (.assets | all(.id > 0 and .size > 0 and .state == "uploaded"))' release-before.json > /dev/null
          jq -r '.assets[].name' release-before.json | LC_ALL=C sort > actual-assets.txt
          jq -S '{id, tag_name, draft, prerelease, assets: [.assets[] | {id,name,size,updated_at,digest,state}] | sort_by(.name)}' release-before.json > inventory-before.json
          if ! diff -u expected-assets.txt actual-assets.txt; then
            echo '::error::Release inventory must be exactly the expected 16 assets; complete the draft and rerun'
            exit 1
          fi
          mkdir assets
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "assets/$asset_name"
          done < <(jq -r '.assets[] | [.id,.name] | @tsv' release-before.json)
          echo 'All 16 expected assets present'

      - name: Verify integrity
        id: verify
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
          EXPECTED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, os, pathlib, re, subprocess, tarfile, zipfile

          version = os.environ['EXPECTED_VERSION']
          tag = os.environ['EXPECTED_TAG']
          root = pathlib.Path('assets')
          expected = pathlib.Path('expected-assets.txt').read_text().splitlines()
          errors, warnings = [], []

          def finish():
              summary = f'# Release integrity verification — `{tag}`\n\n'
              summary += '\n'.join(f'- WARNING: {w}' for w in warnings) + '\n'
              summary += '\n'.join(f'- FAILURE: {e}' for e in errors) if errors else 'All checks passed'
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write(summary + '\n')
              print(summary)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'FAILED={int(bool(errors))}\n')
              if errors:
                  pathlib.Path('/tmp/failure_banner.md').write_text(
                      '<!-- verify-release-integrity: FAILED -->\n'
                      '**AUTO-FLAGGED BY CI: release integrity check failed.**\n\n'
                      + summary + '\n\n---\n\n')
                  raise SystemExit(1)

          # Recheck local inventory after download; reject races and non-regular files.
          if sorted(p.name for p in root.iterdir()) != sorted(expected):
              raise SystemExit('Downloaded inventory is not exactly the expected 16 assets')
          if any(not (root / name).is_file() or (root / name).is_symlink() for name in expected):
              raise SystemExit('Downloaded assets must be regular files')

          # Verify EVERY pair before opening any archive. Never trust sidecar paths.
          for name in expected:
              if name.endswith('.sha256'):
                  continue
              sidecar = (root / (name + '.sha256')).read_text(encoding='utf-8-sig').strip()
              match = re.fullmatch(r'([0-9a-fA-F]{64})(?:[ \t]+\*?([^\r\n]+))?', sidecar)
              if not match or (match.group(2) is not None and match.group(2) != name):
                  errors.append(f'{name}: malformed SHA256 sidecar or wrong filename')
                  continue
              with (root / name).open('rb') as stream:
                  actual = hashlib.file_digest(stream, 'sha256').hexdigest()
              if actual != match.group(1).lower():
                  errors.append(f'{name}: sha256 mismatch')
          if errors:
              finish()

          def versions(data):
              combined = '\0'.join(data[offset:].decode(encoding, errors='ignore')
                                   for encoding, offset in [('utf-16-le', 0), ('utf-16-le', 1), ('utf-16-be', 0)])
              return set(re.findall(r'(?<![0-9.])[0-9]+\.[0-9]+\.[0-9]+(?:-r[0-9]+)?(?![0-9.a-zA-Z-])', combined))

          def inspect_zip(path):
              # Read selected members into memory, never extract archive-controlled paths.
              with zipfile.ZipFile(path) as archive:
                  members = [m for m in archive.infolist() if not m.is_dir()
                             and pathlib.PurePosixPath(m.filename.replace('\\', '/')).name == 'VPNRouter.Core.dll']
                  if not members and path.suffix == '.apk':
                      members = [m for m in archive.infolist() if m.filename.startswith('assemblies/')
                                 and m.filename.endswith(('.blob', '.dll')) and not m.is_dir()]
                  return [archive.read(m) for m in members]

          def inspect_tar(stream):
              with tarfile.open(fileobj=stream, mode='r|*') as archive:
                  return [archive.extractfile(m).read() for m in archive
                          if m.isfile() and pathlib.PurePosixPath(m.name.replace('\\', '/')).name == 'VPNRouter.Core.dll']

          for name in expected:
              if name.endswith('.sha256'):
                  continue
              path = root / name
              hard = name.endswith('-win.zip')
              sink = errors if hard else warnings
              try:
                  if name.endswith('.AppImage'):
                      warnings.append(f'{name}: embedded version inspection unavailable; hash verified; payload never executed')
                      continue
                  if name.endswith(('.zip', '.apk')):
                      blobs = inspect_zip(path)
                  elif name.endswith('.tar.gz'):
                      with path.open('rb') as stream:
                          blobs = inspect_tar(stream)
                  elif name.endswith('.deb'):
                      # Trusted system tool emits data.tar to stdout, runs no package scripts.
                      data = subprocess.check_output(['dpkg-deb', '--fsys-tarfile', str(path)])
                      blobs = inspect_tar(io.BytesIO(data))
                  elif name.endswith('.dmg'):
                      # Stream matching members to stdout: no symlink/path writes or mounts.
                      data = subprocess.check_output(['7z', 'x', '-so', str(path), '-r', '*VPNRouter.Core.dll'], stderr=subprocess.DEVNULL)
                      blobs = [data] if data else []
                  else:
                      raise ValueError('Unsupported asset type')
                  if not blobs:
                      sink.append(f'{name}: VPNRouter.Core.dll/assembly store not found')
                  elif not all(version in versions(data) for data in blobs):
                      sink.append(f'{name}: embedded AppVersion mismatch or missing literal; expected {version}')
              except Exception as error:
                  sink.append(f'{name}: data inspection failed ({type(error).__name__})')
          finish()
          PY

      - name: Confirm final tag-bound inventory
        env:
          EXPECTED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          REMOTE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_TAG" --jq '.sha')
          test "$REMOTE_SHA" = "$WORKFLOW_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_TAG" > release-after.json
          jq -r '.assets[].name' release-after.json | LC_ALL=C sort > final-assets.txt
          diff -u expected-assets.txt final-assets.txt
          jq -S '{id, tag_name, draft, prerelease, assets: [.assets[] | {id,name,size,updated_at,digest,state}] | sort_by(.name)}' release-after.json > inventory-after.json
          diff -u inventory-before.json inventory-after.json

      - name: Flag release on failure
        if: failure() && steps.verify.outputs.FAILED == '1' && (github.event_name != 'workflow_dispatch' || inputs.auto_draft_on_failure)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Defense in depth: dry-run disables both drafting AND release-note edits.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$AUTO_DRAFT_INPUT" != "true" ]; then
            echo '::notice::Dry run: no release mutations'
            exit 0
          fi
          REMOTE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
          test "$REMOTE_SHA" = "$WORKFLOW_SHA"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          OLD_BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          if [[ "$OLD_BODY" == '<!-- verify-release-integrity: FAILED -->'* ]]; then
            STRIPPED=$(printf '%s\n' "$OLD_BODY" | awk 'BEGIN{drop=1} /^---$/{ if (drop) {drop=0; next} } { if (!drop) print }')
          else
            STRIPPED="$OLD_BODY"
          fi
          {
            cat /tmp/failure_banner.md
            printf '%s' "$STRIPPED"
          } > /tmp/new_notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/new_notes.md
