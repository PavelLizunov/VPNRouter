name: Android compile check

on:
  pull_request:
    paths:
      - "VPNRouter.Android/**"
      - "VPNRouter.Core/**"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/android-compile.yml"

permissions:
  contents: read

concurrency:
  group: android-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 8 + 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.301

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4

      - name: Install Android SDK platform 36
        run: |
          set -euo pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Provision libbox.aar from the sing-box-vpnctl release
        env:
          GH_TOKEN: ${{ github.token }}
          LIBBOX_SOURCE_REPO: "PavelLizunov/sing-box-vpnctl"
          LIBBOX_RELEASE_TAG: "v1.14.2-vpnctl.2"
          LIBBOX_ASSET: "libbox-legacy-1.14.2-vpnctl.2.aar"
          LIBBOX_AAR_SHA256: "c09d4bbbe99cc1bf541dcd0b414f8b0edcf727c5a1cdbfe4b69e5aed12d13631"
        run: |
          set -euo pipefail
          mkdir -p VPNRouter.Android/Lib
          gh release download "$LIBBOX_RELEASE_TAG" \
            --repo "$LIBBOX_SOURCE_REPO" \
            --pattern "$LIBBOX_ASSET" \
            --output VPNRouter.Android/Lib/libbox.aar
          ACTUAL_SHA="$(sha256sum VPNRouter.Android/Lib/libbox.aar | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$LIBBOX_AAR_SHA256" ]; then
            echo "::error::libbox.aar SHA256 mismatch (expected $LIBBOX_AAR_SHA256, got $ACTUAL_SHA)"
            exit 1
          fi
          gh attestation verify VPNRouter.Android/Lib/libbox.aar --repo "$LIBBOX_SOURCE_REPO"

      - name: dotnet build (android-arm64, unsigned)
        run: |
          set -euo pipefail
          dotnet build VPNRouter.Android/VPNRouter.Android.csproj \
            -c Release \
            -p:RuntimeIdentifier=android-arm64 \
            -nologo

      - name: Verify the APK is arm64-only and its core keeps AWG and XHTTP
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find VPNRouter.Android/bin/Release -name '*.apk' -type f)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::no APK was produced by the build"
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            ABIS="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')"
            echo "$APK native ABIs: $ABIS"
            if [ "$ABIS" != "arm64-v8a " ]; then
              echo "::error::$APK must carry arm64-v8a native libraries only, found: $ABIS"
              exit 1
            fi
            WORK="$(mktemp -d)"
            unzip -q -o "$APK" lib/arm64-v8a/libbox.so -d "$WORK"
            TAGS="$(grep -a -o -m1 -- '-tags=with_[A-Za-z0-9_,]*' "$WORK/lib/arm64-v8a/libbox.so" || true)"
            echo "libbox build tags: $TAGS"
            for NEED in with_awg with_xhttp; do
              case ",${TAGS#-tags=}," in
                *",$NEED,"*) ;;
                *) echo "::error::libbox.so was built without $NEED"; exit 1 ;;
              esac
            done
            rm -rf "$WORK"
          done
