name: Android compile check

on:
  pull_request:
    paths:
      - "VPNRouter.Android/**"
      - "VPNRouter.Tests/Android/**"
      - "VPNRouter.Core/**"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/android-compile.yml"

permissions:
  contents: read

concurrency:
  group: android-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET 8 + 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Record Android build worker and SDK
        run: python .github/scripts/report-test-sdk.py

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Check per-app tunnel policy
        run: |
          mkdir -p "$RUNNER_TEMP/tunnel-policy"
          cd "$RUNNER_TEMP/tunnel-policy"
          artifact=org/json/json/20250517/json-20250517.jar
          curl -fsSL --retry 2 --retry-max-time 20 -o json.jar "https://repo.maven.apache.org/maven2/$artifact" ||
            curl -fsSL --retry 2 --retry-max-time 20 -o json.jar "https://maven-central.storage-download.googleapis.com/maven2/$artifact"
          echo '3ea61b2a06e31edf1c91134fe9106b0ebb16628be169f3db75bc7a2b06b45796  json.jar' | sha256sum --check
          javac -classpath json.jar -d . "$GITHUB_WORKSPACE/VPNRouter.Android/AndroidTunnelPolicy.java" \
            "$GITHUB_WORKSPACE/VPNRouter.Tests/Android/AndroidTunnelPolicyTest.java"
          java -classpath .:json.jar com.ninitux.vpnrouter.AndroidTunnelPolicyTest

      - name: Check native engine ownership and diagnostic privacy
        run: |
          mkdir -p "$RUNNER_TEMP/native-engine"
          javac -d "$RUNNER_TEMP/native-engine" \
            VPNRouter.Android/NativeEngineSlot.java VPNRouter.Tests/Android/NativeEngineSlotTest.java \
            VPNRouter.Android/NativeReportPrivacy.java VPNRouter.Tests/Android/NativeReportPrivacyTest.java
          java -cp "$RUNNER_TEMP/native-engine" com.ninitux.vpnrouter.NativeEngineSlotTest
          java -cp "$RUNNER_TEMP/native-engine" com.ninitux.vpnrouter.NativeReportPrivacyTest "$(mktemp -d)"

      - name: Check Android tunnel retirement and stats retries
        run: |
          mkdir -p "$RUNNER_TEMP/tunnel-lifecycle"
          javac -d "$RUNNER_TEMP/tunnel-lifecycle" \
            VPNRouter.Android/AndroidTunnelSession.java VPNRouter.Android/AndroidTunnelStart.java VPNRouter.Android/AndroidStatsSubscription.java \
            VPNRouter.Tests/Android/AndroidTunnelLifecycleTest.java
          java -cp "$RUNNER_TEMP/tunnel-lifecycle" com.ninitux.vpnrouter.AndroidTunnelLifecycleTest

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4

      - name: Install Android SDK platform 36
        run: |
          set -euo pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Provision libbox.aar from the sing-box-vpnctl release
        env:
          GH_TOKEN: ${{ github.token }}
          LIBBOX_SOURCE_REPO: "PavelLizunov/sing-box-vpnctl"
          LIBBOX_RELEASE_TAG: "v1.14.5-vpnctl.1"
          LIBBOX_ASSET: "libbox-legacy-1.14.5-vpnctl.1.aar"
          LIBBOX_AAR_SHA256: "0db1d467356c67df353b5826e48c09a0ca669576135e605b7dfe5ff4cb9cbf99"
        run: |
          set -euo pipefail
          mkdir -p VPNRouter.Android/Lib
          gh release download "$LIBBOX_RELEASE_TAG" \
            --repo "$LIBBOX_SOURCE_REPO" \
            --pattern "$LIBBOX_ASSET" \
            --output VPNRouter.Android/Lib/libbox.aar
          ACTUAL_SHA="$(sha256sum VPNRouter.Android/Lib/libbox.aar | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$LIBBOX_AAR_SHA256" ]; then
            echo "::error::libbox.aar SHA256 mismatch (expected $LIBBOX_AAR_SHA256, got $ACTUAL_SHA)"
            exit 1
          fi
          gh attestation verify VPNRouter.Android/Lib/libbox.aar --repo "$LIBBOX_SOURCE_REPO"

      - name: dotnet build (android-arm64, unsigned)
        run: |
          set -euo pipefail
          dotnet build VPNRouter.Android/VPNRouter.Android.csproj \
            -c Release \
            -p:RuntimeIdentifier=android-arm64 \
            -nologo

      - name: Verify the arm64 APK core transport profile
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find VPNRouter.Android/bin/Release -name '*.apk' -type f)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::no APK was produced by the build"
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            ABIS="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')"
            echo "$APK native ABIs: $ABIS"
            if [ "$ABIS" != "arm64-v8a " ]; then
              echo "::error::$APK must carry arm64-v8a native libraries only, found: $ABIS"
              exit 1
            fi
            WORK="$(mktemp -d)"
            unzip -q -o "$APK" lib/arm64-v8a/libbox.so -d "$WORK"
            TAGS="$(grep -a -o -m1 -- '-tags=with_[A-Za-z0-9_,]*' "$WORK/lib/arm64-v8a/libbox.so" || true)"
            echo "libbox build tags: $TAGS"
            for NEED in with_awg with_xhttp with_turnrelay with_trusttunnel with_mieru; do
              case ",${TAGS#-tags=}," in
                *",$NEED,"*) ;;
                *) echo "::error::libbox.so was built without $NEED"; exit 1 ;;
              esac
            done
            if grep -Eq '(^|,)(with_naive_outbound|with_purego)(,|$)' <<< "${TAGS#-tags=}" ||
               grep -aq 'github.com/sagernet/cronet-go' "$WORK/lib/arm64-v8a/libbox.so" ||
               grep -qi 'libcronet' <<< "$(unzip -Z1 "$APK")"; then
              echo "::error::unexpected NaiveProxy or Cronet in $APK"
              exit 1
            fi
            rm -rf "$WORK"
          done

      - name: Retain the verified APK for device testing
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-device-test-${{ github.event.pull_request.head.sha }}
          path: VPNRouter.Android/bin/Release/**/android-arm64/*-Signed.apk
          if-no-files-found: error
          retention-days: 1
