name: Build UI MCP

# Builds the UI exploration MCP server (VPNRouter.Tools/UiMcp) for Linux, runs it once against the real XAML as a smoke test and
# keeps it as an artifact, so a workstation can run the binary without a .NET SDK. A win-x64 build is kept as well, so the README
# screens can be rendered on the Windows test machine (Windows strings and fonts); it is not smoke-tested in CI. See plans/phase-m1-ui-mcp-2026-10-02.md.

on:
  push:
    branches: [main, business]
    paths:
      - 'VPNRouter.Tools/UiMcp/**'
      - 'VPNRouter.Tools/UiProbe/**'
      - 'VPNRouter.App/**'
      - 'VPNRouter.Core/**'
      - 'tools/ui-mcp/**'
      - 'packaging/windows/support/**'
      - 'packaging/business-support/**'
      - 'packaging/windows/business.iss'
      - 'packaging/windows/business-update.md'
      - 'tools/build-business-update.ps1'
      - 'VPNRouter.Tests/Business*.cs'
      - '.github/workflows/build-ui-mcp.yml'
  pull_request:
    paths:
      - 'VPNRouter.App/**'
      - 'VPNRouter.Core/**'
      - 'VPNRouter.Tools/UiMcp/**'
      - 'VPNRouter.Tools/UiProbe/**'
      - 'tools/ui-mcp/**'
      - 'packaging/windows/support/**'
      - 'packaging/business-support/**'
      - 'packaging/windows/business.iss'
      - 'packaging/windows/business-update.md'
      - 'tools/build-business-update.ps1'
      - 'VPNRouter.Tests/Business*.cs'
      - '.github/workflows/build-ui-mcp.yml'
  workflow_dispatch:
    inputs:
      business_pilot:
        description: 'Build the private Business pilot instead of the UI MCP server'
        type: boolean
        default: false
      business_support:
        description: 'Build the privately configured single-file diagnostic tool'
        type: boolean
        default: false
      business_shared_update:
        description: 'Build a credential-free Business update ZIP'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.business_pilot && !inputs.business_support && !inputs.business_shared_update }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish (linux-x64, self-contained)
        run: dotnet publish VPNRouter.Tools/UiMcp/UiMcp.csproj -c Release -p:UiMcpRid=linux-x64 -o publish/ui-mcp

      - name: Publish (win-x64, self-contained)
        run: dotnet publish VPNRouter.Tools/UiMcp/UiMcp.csproj -c Release -p:UiMcpRid=win-x64 -o publish/ui-mcp-win

      - name: Smoke session
        run: |
          set -o pipefail
          mkdir -p smoke
          python3 tools/ui-mcp/mcpcall.py --out smoke --server ./publish/ui-mcp/vpnrouter-ui-mcp -- \
            ui_catalog '{}' \
            ui_render '{"surface":"apps","width":520,"height":1100}' \
            ui_render '{"surface":"window-advanced","width":520,"height":900,"theme":"dark","language":"ru"}' \
            ui_sweep '{"surface":"window-advanced","speed_ms":0,"mode":"monkey","max_steps":150,"render_every":7,"seed":7}' \
            2>&1 | tee smoke/session.txt
          grep -q "failures: 0" smoke/session.txt
          test "$(ls smoke/*.png | wc -l)" -ge 3

      - name: Pack
        run: |
          tar -C publish -czf vpnrouter-ui-mcp-linux-x64.tar.gz ui-mcp
          tar -C publish -czf vpnrouter-ui-mcp-win-x64.tar.gz ui-mcp-win

      - name: Upload server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vpnrouter-ui-mcp-linux-x64
          path: vpnrouter-ui-mcp-linux-x64.tar.gz
          retention-days: 30

      - name: Upload Windows server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vpnrouter-ui-mcp-win-x64
          path: vpnrouter-ui-mcp-win-x64.tar.gz
          retention-days: 30

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-mcp-smoke
          path: smoke
          retention-days: 14

  business-surface:
    if: ${{ !inputs.business_pilot && !inputs.business_support && !inputs.business_shared_update }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Exact source and Windows tool preflight
        shell: pwsh
        run: |
          git rev-parse HEAD
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $disk = Get-PSDrive C
          Write-Host "CPU=$([Environment]::ProcessorCount), load=$((($cpu | Measure-Object LoadPercentage -Average).Average)) percent, available RAM=$($os.FreePhysicalMemory) KiB, free disk=$([math]::Round($disk.Free/1GB,2)) GiB"
          Get-CimInstance Win32_PageFileUsage | Select-Object AllocatedBaseSize,CurrentUsage
          Get-Process dotnet,msbuild,VBCSCompiler,java -ErrorAction SilentlyContinue | Select-Object ProcessName,Id
          dotnet --list-sdks
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path $csc) -or $os.FreePhysicalMemory -lt 3MB -or $disk.Free -lt 8GB) { throw 'Windows support build preflight failed.' }
      - name: Build shared Release solution
        run: dotnet build VPNRouter.sln -c Release
      - name: Business policy and isolated UI checks
        run: dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~Business" --logger "console;verbosity=normal"
      - name: Verify credential-free Business publication
        shell: pwsh
        run: |
          $priorEdition = $env:VPNRouterEdition
          $priorShared = $env:BusinessSharedUpdate
          $priorPayload = $env:VPNROUTER_BUSINESS_SHARED_PAYLOAD_DIR
          try {
            if ($env:BusinessConnectionFile) { throw 'Shared publication refuses a connection file.' }
            $env:VPNRouterEdition = 'Business'
            $env:BusinessSharedUpdate = 'true'
            $env:VPNROUTER_BUSINESS_SHARED_PAYLOAD_DIR = Join-Path $env:RUNNER_TEMP 'business-shared-publication'
            dotnet publish VPNRouter.App/VPNRouter.App.csproj -c Release -r win-x64 --self-contained true -o $env:VPNROUTER_BUSINESS_SHARED_PAYLOAD_DIR
            if ($LASTEXITCODE -ne 0) { throw 'Shared Business publish failed.' }
            dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~BusinessUpdatePackagingContractTests.SharedPublishedAssemblies' --logger 'console;verbosity=minimal'
            if ($LASTEXITCODE -ne 0) { throw 'Shared Business binary identity validation failed.' }
          } finally {
            $env:VPNRouterEdition = $priorEdition
            $env:BusinessSharedUpdate = $priorShared
            $env:VPNROUTER_BUSINESS_SHARED_PAYLOAD_DIR = $priorPayload
          }
      - name: Package standalone Business support scripts
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'business-support-delivery'
          New-Item -ItemType Directory -Path $out | Out-Null
          $zip = Join-Path $out 'VPNRouterBusiness-Support.zip'
          Compress-Archive -Path packaging/windows/support/Collect-VPNRouterBusiness-Diagnostics.ps1,packaging/windows/support/Send-VPNRouterBusiness-Diagnostics.ps1,packaging/windows/support/Collect-VPNRouterBusiness-Diagnostics.cmd,packaging/windows/support/README.ru.txt -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  VPNRouterBusiness-Support.zip" | Set-Content "$zip.sha256" -Encoding ascii
          git rev-parse HEAD | Set-Content (Join-Path $out 'source-sha.txt') -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business-support-${{ github.sha }}
          path: ${{ runner.temp }}/business-support-delivery/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business-fixture-screenshots-${{ github.sha }}
          path: VPNRouter.Tests/screenshots/business-*.png
          if-no-files-found: error

  business-receiver:
    if: ${{ !inputs.business_pilot && !inputs.business_support && !inputs.business_shared_update }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exact source and Python preflight
        run: |
          git rev-parse HEAD
          python3 --version
          nproc
          uptime
          free -m
          df -h .
      - name: Receiver HTTP and storage fixtures
        run: python3 -m unittest discover -s packaging/business-support -p 'test_*.py' -v

  business-support:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.business_support }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exact source and compiler/encryption preflight
        shell: pwsh
        run: |
          git rev-parse HEAD
          $os = Get-CimInstance Win32_OperatingSystem
          $disk = Get-PSDrive C
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "CPU=$([Environment]::ProcessorCount), load=$((($cpu | Measure-Object LoadPercentage -Average).Average)), RAM available=$($os.FreePhysicalMemory) KiB, free disk=$([math]::Round($disk.Free/1GB,2)) GiB"
          Get-CimInstance Win32_PageFileUsage | Select-Object AllocatedBaseSize,CurrentUsage
          Get-Process csc,dotnet,msbuild -ErrorAction SilentlyContinue | Select-Object ProcessName,Id
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $gpg = 'C:\Program Files\Git\usr\bin\gpg.exe'
          if (!(Test-Path $csc) -or !(Test-Path $gpg) -or $os.FreePhysicalMemory -lt 1MB -or $disk.Free -lt 1GB) { throw 'Support compiler/encryption tool or capacity missing.' }
      - name: Build and encrypt the personal support executable
        shell: pwsh
        env:
          SUPPORT_SETTINGS: ${{ secrets.VPNROUTER_BUSINESS_SUPPORT_SETTINGS }}
          DELIVERY_KEY: ${{ secrets.VPNROUTER_BUSINESS_SUPPORT_DELIVERY_KEY }}
        run: |
          $private = Join-Path $env:RUNNER_TEMP 'support-private'
          $delivery = Join-Path $env:RUNNER_TEMP 'support-delivery'
          New-Item -ItemType Directory -Path $private,$delivery | Out-Null
          try {
            if (!$env:SUPPORT_SETTINGS -or !$env:DELIVERY_KEY) { throw 'Private support inputs missing.' }
            $settings = Join-Path $private 'settings.json'
            $key = Join-Path $private 'delivery-key.txt'
            [IO.File]::WriteAllText($settings, $env:SUPPORT_SETTINGS)
            [IO.File]::WriteAllText($key, $env:DELIVERY_KEY)
            Remove-Item Env:SUPPORT_SETTINGS,Env:DELIVERY_KEY
            ./packaging/windows/support/build-support.ps1 -SettingsFile $settings -OutputDir $private
            $exe = Join-Path $private 'VPNRouterBusiness-Diagnostics.exe'
            $homeDir = Join-Path $private 'gpg'
            New-Item -ItemType Directory -Path $homeDir | Out-Null
            function ConvertTo-GpgPath([string]$path) { '/' + $path.Substring(0,1).ToLowerInvariant() + $path.Substring(2).Replace('\','/') }
            & 'C:\Program Files\Git\usr\bin\gpg.exe' --homedir (ConvertTo-GpgPath $homeDir) --batch --yes --pinentry-mode loopback --passphrase-file (ConvertTo-GpgPath $key) --cipher-algo AES256 --symmetric --output (ConvertTo-GpgPath (Join-Path $delivery 'VPNRouterBusiness-Diagnostics.exe.gpg')) (ConvertTo-GpgPath $exe)
            if ($LASTEXITCODE -ne 0) { throw 'Support encryption failed.' }
            Copy-Item "$exe.sha256" $delivery
            git rev-parse HEAD | Set-Content (Join-Path $delivery 'source-sha.txt') -Encoding ascii
          } finally { Remove-Item -LiteralPath $private -Recurse -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business-support-private-${{ github.sha }}
          path: ${{ runner.temp }}/support-delivery/
          if-no-files-found: error
          retention-days: 3

  business-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.business_pilot }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Exact source and read-only capacity/tool preflight
        shell: pwsh
        run: |
          git rev-parse HEAD
          $cpu = Get-CimInstance Win32_Processor
          $os = Get-CimInstance Win32_OperatingSystem
          $disk = Get-PSDrive C
          $jobs = @(Get-Process dotnet,msbuild,VBCSCompiler,java -ErrorAction SilentlyContinue)
          Write-Host "CPU count=$([Environment]::ProcessorCount), load=$((($cpu | Measure-Object LoadPercentage -Average).Average)) percent"
          Write-Host "Available RAM=$($os.FreePhysicalMemory) KiB, free disk=$([math]::Round($disk.Free/1GB,2)) GiB, competing jobs=$($jobs.Count)"
          Get-CimInstance Win32_PageFileUsage | Select-Object AllocatedBaseSize,CurrentUsage
          dotnet --list-sdks
          go version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $gpg = 'C:\Program Files\Git\usr\bin\gpg.exe'
          if (!(Test-Path $iscc) -or !(Test-Path $gpg)) { throw 'Required packaging/encryption tool missing.' }
          if ($os.FreePhysicalMemory -lt 3MB -or $disk.Free -lt 8GB -or $jobs.Count -ne 0) { throw 'Insufficient build headroom.' }
      - name: Compile, validate and encrypt individual installer
        shell: pwsh
        env:
          BUSINESS_CONFIG: ${{ secrets.VPNROUTER_BUSINESS_PILOT_CONFIG }}
          BUSINESS_DELIVERY_KEY: ${{ secrets.VPNROUTER_BUSINESS_PILOT_DELIVERY_KEY }}
        run: |
          $private = Join-Path $env:RUNNER_TEMP 'business-private'
          $output = Join-Path $private 'out'
          $delivery = Join-Path $env:RUNNER_TEMP 'business-delivery'
          New-Item -ItemType Directory -Force -Path $private,$output,$delivery | Out-Null
          try {
            if (!$env:BUSINESS_CONFIG -or !$env:BUSINESS_DELIVERY_KEY) { throw 'Private pilot inputs missing.' }
            $connection = Join-Path $private 'connection.txt'
            $key = Join-Path $private 'key.txt'
            [IO.File]::WriteAllText($connection, $env:BUSINESS_CONFIG)
            [IO.File]::WriteAllText($key, $env:BUSINESS_DELIVERY_KEY)
            Remove-Item Env:BUSINESS_CONFIG,Env:BUSINESS_DELIVERY_KEY
            ./tools/build-business.ps1 -ConnectionFile $connection -OutputDir $output
            $env:VPNRouterEdition = 'Business'
            $env:BusinessConnectionFile = $connection
            $env:VPNROUTER_BUSINESS_VALIDATE_DIR = Join-Path $private 'validation'
            $env:VPNROUTER_BUSINESS_PAYLOAD_DIR = Join-Path $output 'payload\app'
            New-Item -ItemType Directory -Force -Path $env:VPNROUTER_BUSINESS_VALIDATE_DIR | Out-Null
            dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --filter 'FullyQualifiedName~BusinessPilotValidationTests' --logger 'console;verbosity=minimal'
            if ($LASTEXITCODE -ne 0) { throw 'Embedded pilot first-run validation failed.' }
            $core = Join-Path $env:VPNROUTER_BUSINESS_PAYLOAD_DIR 'sing-box.exe'
            foreach ($mode in @('split','full')) {
              $config = Join-Path $env:VPNROUTER_BUSINESS_VALIDATE_DIR "$mode.json"
              & $core check -c $config *> (Join-Path $private "check-$mode.log")
              if ($LASTEXITCODE -ne 0) { throw "Native core rejected Business $mode configuration." }
              Write-Host "Business $mode configuration: native core check PASS (not a live VPN test)."
            }
            $installer = (Get-ChildItem $output -Filter 'VPNRouterBusiness-Setup-*.exe' | Select-Object -First 1).FullName
            $gpg = 'C:\Program Files\Git\usr\bin\gpg.exe'
            $gpgHome = Join-Path $private 'gpg'
            New-Item -ItemType Directory -Force -Path $gpgHome | Out-Null
            # Git's gpg is an MSYS program and expects POSIX drive paths.
            function ConvertTo-GpgPath([string]$path) {
              '/' + $path.Substring(0,1).ToLowerInvariant() + $path.Substring(2).Replace('\','/')
            }
            $encrypted = Join-Path $delivery 'VPNRouterBusiness-Pilot.exe.gpg'
            & $gpg --homedir (ConvertTo-GpgPath $gpgHome) --batch --yes --pinentry-mode loopback --passphrase-file (ConvertTo-GpgPath $key) --cipher-algo AES256 --symmetric --output (ConvertTo-GpgPath $encrypted) (ConvertTo-GpgPath $installer)
            if ($LASTEXITCODE -ne 0) { throw 'Private installer encryption failed.' }
            Copy-Item "$installer.sha256" (Join-Path $delivery 'installer.sha256')
            git rev-parse HEAD | Set-Content (Join-Path $delivery 'source-sha.txt')
          } finally {
            Remove-Item -LiteralPath $private -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload encrypted installer only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business-pilot-encrypted-${{ github.sha }}
          path: ${{ runner.temp }}/business-delivery/
          if-no-files-found: error
          retention-days: 3

  business-shared-update:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.business_shared_update && !inputs.business_pilot && !inputs.business_support }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Exact source and Windows capacity/tool preflight
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { throw 'Source SHA mismatch.' }
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $disk = Get-PSDrive C
          $jobs = @(Get-Process dotnet,msbuild,VBCSCompiler,java -ErrorAction SilentlyContinue)
          Write-Host "CPU=$([Environment]::ProcessorCount), load=$((($cpu | Measure-Object LoadPercentage -Average).Average)) percent, available RAM=$($os.FreePhysicalMemory) KiB, free disk=$([math]::Round($disk.Free/1GB,2)) GiB, competing jobs=$($jobs.Count)"
          Get-CimInstance Win32_PageFileUsage | Select-Object AllocatedBaseSize,CurrentUsage
          dotnet --list-sdks
          go version
          if ($os.FreePhysicalMemory -lt 3MB -or $disk.Free -lt 8GB -or $jobs.Count -ne 0) { throw 'Shared build preflight failed.' }
      - name: Build and validate shared Business update
        shell: pwsh
        run: ./tools/build-business-update.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP 'business-shared-update')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business-shared-update-${{ github.sha }}
          path: |
            ${{ runner.temp }}/business-shared-update/*.zip
            ${{ runner.temp }}/business-shared-update/*.zip.sha256
            ${{ runner.temp }}/business-shared-update/source-sha.txt
          if-no-files-found: error
          retention-days: 14
