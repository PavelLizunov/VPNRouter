name: Build UI MCP

# Builds the UI exploration MCP server (VPNRouter.Tools/UiMcp) for Linux, runs it once against the real XAML as a smoke test and
# keeps it as an artifact, so a workstation can run the binary without a .NET SDK. A win-x64 build is kept as well, so the README
# screens can be rendered on the Windows test machine (Windows strings and fonts); it is not smoke-tested in CI. See plans/phase-m1-ui-mcp-2026-10-02.md.

on:
  push:
    branches: [main]
    paths:
      - 'VPNRouter.Tools/UiMcp/**'
      - 'VPNRouter.Tools/UiProbe/**'
      - 'VPNRouter.App/**'
      - 'VPNRouter.Core/**'
      - 'tools/ui-mcp/**'
      - '.github/workflows/build-ui-mcp.yml'
  pull_request:
    paths:
      - 'VPNRouter.Tools/UiMcp/**'
      - 'VPNRouter.Tools/UiProbe/**'
      - 'tools/ui-mcp/**'
      - '.github/workflows/build-ui-mcp.yml'
  workflow_dispatch:
    inputs:
      business_pilot:
        description: 'Build the private Business pilot instead of the UI MCP server'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.business_pilot }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish (linux-x64, self-contained)
        run: dotnet publish VPNRouter.Tools/UiMcp/UiMcp.csproj -c Release -p:UiMcpRid=linux-x64 -o publish/ui-mcp

      - name: Publish (win-x64, self-contained)
        run: dotnet publish VPNRouter.Tools/UiMcp/UiMcp.csproj -c Release -p:UiMcpRid=win-x64 -o publish/ui-mcp-win

      - name: Smoke session
        run: |
          set -o pipefail
          mkdir -p smoke
          python3 tools/ui-mcp/mcpcall.py --out smoke --server ./publish/ui-mcp/vpnrouter-ui-mcp -- \
            ui_catalog '{}' \
            ui_render '{"surface":"apps","width":520,"height":1100}' \
            ui_render '{"surface":"window-advanced","width":520,"height":900,"theme":"dark","language":"ru"}' \
            ui_sweep '{"surface":"window-advanced","speed_ms":0,"mode":"monkey","max_steps":150,"render_every":7,"seed":7}' \
            2>&1 | tee smoke/session.txt
          grep -q "failures: 0" smoke/session.txt
          test "$(ls smoke/*.png | wc -l)" -ge 3

      - name: Pack
        run: |
          tar -C publish -czf vpnrouter-ui-mcp-linux-x64.tar.gz ui-mcp
          tar -C publish -czf vpnrouter-ui-mcp-win-x64.tar.gz ui-mcp-win

      - name: Upload server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vpnrouter-ui-mcp-linux-x64
          path: vpnrouter-ui-mcp-linux-x64.tar.gz
          retention-days: 30

      - name: Upload Windows server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vpnrouter-ui-mcp-win-x64
          path: vpnrouter-ui-mcp-win-x64.tar.gz
          retention-days: 30

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ui-mcp-smoke
          path: smoke
          retention-days: 14

  business-surface:
    if: ${{ !inputs.business_pilot }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Build shared Release solution
        run: dotnet build VPNRouter.sln -c Release
      - name: Business policy and isolated UI checks
        run: dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~Business" --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business-fixture-screenshots-${{ github.sha }}
          path: VPNRouter.Tests/screenshots/business-*.png
          if-no-files-found: error

  business-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.business_pilot }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Exact source and read-only capacity/tool preflight
        shell: pwsh
        run: |
          git rev-parse HEAD
          $cpu = Get-CimInstance Win32_Processor
          $os = Get-CimInstance Win32_OperatingSystem
          $disk = Get-PSDrive C
          $jobs = @(Get-Process dotnet,msbuild,VBCSCompiler,java -ErrorAction SilentlyContinue)
          Write-Host "CPU count=$([Environment]::ProcessorCount), load=$((($cpu | Measure-Object LoadPercentage -Average).Average)) percent"
          Write-Host "Available RAM=$($os.FreePhysicalMemory) KiB, free disk=$([math]::Round($disk.Free/1GB,2)) GiB, competing jobs=$($jobs.Count)"
          Get-CimInstance Win32_PageFileUsage | Select-Object AllocatedBaseSize,CurrentUsage
          dotnet --list-sdks
          go version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $gpg = 'C:\Program Files\Git\usr\bin\gpg.exe'
          if (!(Test-Path $iscc) -or !(Test-Path $gpg)) { throw 'Required packaging/encryption tool missing.' }
          if ($os.FreePhysicalMemory -lt 3MB -or $disk.Free -lt 8GB -or $jobs.Count -ne 0) { throw 'Insufficient build headroom.' }
      - name: Compile, validate and encrypt individual installer
        shell: pwsh
        env:
          BUSINESS_CONFIG: ${{ secrets.VPNROUTER_BUSINESS_PILOT_CONFIG }}
          BUSINESS_DELIVERY_KEY: ${{ secrets.VPNROUTER_BUSINESS_PILOT_DELIVERY_KEY }}
        run: |
          $private = Join-Path $env:RUNNER_TEMP 'business-private'
          $output = Join-Path $private 'out'
          $delivery = Join-Path $env:RUNNER_TEMP 'business-delivery'
          New-Item -ItemType Directory -Force -Path $private,$output,$delivery | Out-Null
          try {
            if (!$env:BUSINESS_CONFIG -or !$env:BUSINESS_DELIVERY_KEY) { throw 'Private pilot inputs missing.' }
            $connection = Join-Path $private 'connection.txt'
            $key = Join-Path $private 'key.txt'
            [IO.File]::WriteAllText($connection, $env:BUSINESS_CONFIG)
            [IO.File]::WriteAllText($key, $env:BUSINESS_DELIVERY_KEY)
            Remove-Item Env:BUSINESS_CONFIG,Env:BUSINESS_DELIVERY_KEY
            ./tools/build-business.ps1 -ConnectionFile $connection -OutputDir $output
            $env:VPNRouterEdition = 'Business'
            $env:BusinessConnectionFile = $connection
            $env:VPNROUTER_BUSINESS_VALIDATE_DIR = Join-Path $private 'validation'
            $env:VPNROUTER_BUSINESS_PAYLOAD_DIR = Join-Path $output 'payload\app'
            New-Item -ItemType Directory -Force -Path $env:VPNROUTER_BUSINESS_VALIDATE_DIR | Out-Null
            dotnet test VPNRouter.Tests/VPNRouter.Tests.csproj -c Release --filter 'FullyQualifiedName~BusinessPilotValidationTests' --logger 'console;verbosity=minimal'
            if ($LASTEXITCODE -ne 0) { throw 'Embedded pilot first-run validation failed.' }
            $core = Join-Path $env:VPNROUTER_BUSINESS_PAYLOAD_DIR 'sing-box.exe'
            foreach ($mode in @('split','full')) {
              $config = Join-Path $env:VPNROUTER_BUSINESS_VALIDATE_DIR "$mode.json"
              & $core check -c $config *> (Join-Path $private "check-$mode.log")
              if ($LASTEXITCODE -ne 0) { throw "Native core rejected Business $mode configuration." }
              Write-Host "Business $mode configuration: native core check PASS (not a live VPN test)."
            }
            $installer = (Get-ChildItem $output -Filter 'VPNRouterBusiness-Setup-*.exe' | Select-Object -First 1).FullName
            $gpg = 'C:\Program Files\Git\usr\bin\gpg.exe'
            $gpgHome = Join-Path $private 'gpg'
            New-Item -ItemType Directory -Force -Path $gpgHome | Out-Null
            # Git's gpg is an MSYS program and expects POSIX drive paths.
            function ConvertTo-GpgPath([string]$path) {
              '/' + $path.Substring(0,1).ToLowerInvariant() + $path.Substring(2).Replace('\','/')
            }
            $encrypted = Join-Path $delivery 'VPNRouterBusiness-Pilot.exe.gpg'
            & $gpg --homedir (ConvertTo-GpgPath $gpgHome) --batch --yes --pinentry-mode loopback --passphrase-file (ConvertTo-GpgPath $key) --cipher-algo AES256 --symmetric --output (ConvertTo-GpgPath $encrypted) (ConvertTo-GpgPath $installer)
            if ($LASTEXITCODE -ne 0) { throw 'Private installer encryption failed.' }
            Copy-Item "$installer.sha256" (Join-Path $delivery 'installer.sha256')
            git rev-parse HEAD | Set-Content (Join-Path $delivery 'source-sha.txt')
          } finally {
            Remove-Item -LiteralPath $private -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload encrypted installer only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business-pilot-encrypted-${{ github.sha }}
          path: ${{ runner.temp }}/business-delivery/
          if-no-files-found: error
          retention-days: 3
