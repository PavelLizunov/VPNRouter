name: Build Free Configs Pool


on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild even if recent (for testing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: free-pool
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Download GeoIP database
        run: |
          mkdir -p /tmp/geoip
          curl -sL -o /tmp/geoip/GeoLite2-Country.mmdb "https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-Country.mmdb"
          ls -la /tmp/geoip/

      - name: Build and run PoolAggregator
        run: |
          mkdir -p /tmp/out
          dotnet run --project VPNRouter.Tools/PoolAggregator \
            --configuration Release \
            -- --output /tmp/out/pool.json --mmdb /tmp/geoip/GeoLite2-Country.mmdb

      - name: Inspect output
        run: |
          SIZE=$(stat -c%s /tmp/out/pool.json)
          COUNT=$(jq '.totalConfigs' /tmp/out/pool.json)
          UPDATED=$(jq -r '.updatedAt' /tmp/out/pool.json)
          echo "Pool size: $(($SIZE / 1024)) KB, $COUNT entries, updated $UPDATED"

          if [ "$COUNT" -lt 1000 ]; then
            echo "::warning::Pool has only $COUNT entries (expected >= 1000) — sources may be degraded"
          fi

          gzip -k /tmp/out/pool.json
          ls -la /tmp/out/

      - name: Upload pool.json to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! gh release view free-pool-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Creating rolling release 'free-pool-latest'..."
            gh release create free-pool-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Free Configs Pool (rolling)" \
              --notes "Auto-updated every 6 hours. Aggregated metadata of public VLESS sources. **Not** a released app version — the VPNRouter app downloads \`pool.json\` from this release for fast refresh. See v2.14.1+ for client integration." \
              --prerelease \
              --target main
          fi

          gh release upload free-pool-latest \
            /tmp/out/pool.json /tmp/out/pool.json.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "✓ Uploaded to https://github.com/$GITHUB_REPOSITORY/releases/tag/free-pool-latest"
