version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/VPNRouter.Core"
      - "/VPNRouter.App"
      - "/VPNRouter.CLI"
      - "/VPNRouter.Service"
      - "/VPNRouter.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-all:
        patterns:
          - "*"
