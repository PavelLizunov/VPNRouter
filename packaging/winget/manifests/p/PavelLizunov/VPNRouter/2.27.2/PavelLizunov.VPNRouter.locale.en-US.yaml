ShortDescription: Process-based split-tunnel VPN router (VLESS+Reality via sing-box TUN).
Description: |-
  VPNRouter is a process-based split-tunnel VPN client. It routes only the
  applications you pick through a VLESS+Reality proxy (via sing-box in TUN
  mode); everything else goes direct to your ISP. No manual proxy settings
  per app. Includes a 25k+ public VLESS aggregator (Free Configs tab), real-
  connectivity verification, and a rich GUI built on Avalonia.

  Also ships as a Windows Service (runs at boot, survives user logoff), with
  built-in passwordless TUN start on Linux (POSIX capabilities via .deb
  postinst) and macOS (sudoers.d NOPASSWD entry on first Connect).
